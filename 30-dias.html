/* ---------- MOVIMIENTO ---------- */
/* movimiento: detalle por día (minutos, distancia, calorías) */
let movWeek=0;
const MET={w:3.5,r:7,y:2.5,p:3,s:3.5,d:5,m:3,x:1.3};
function movDay(n,kg){
  const w=wdOf(n), st=stageOf(n), ex=exercise(n);
  let segs,title,sub,cls,timer,km=0;
  if(ex.kind==="cardio"){const c=ex.c, walk=5+c.r*c.offS/60+5, jog=c.r*c.onS/60, yo=ex.second[1]==="p1";
    title="Caminata/trote"; sub="+ "+ex.second[0]+(yo?" (pilates suave)":" (yoga suave)"); cls="c-lav"; timer="cardio";
    segs=[["Calentar caminando",5,"w","w"],["Intervalos",c.r*(c.onS+c.offS)/60,"r","r",c.r+" × ("+c.on+" trote + "+c.off+" caminar)"],["Enfriar caminando",5,"w","w"],[ex.second[0],10,yo?"p":"y","y",yo?"Pilates suave":"Yoga suave"]];
    km=walk*5/60+jog*7.5/60;
    const kc=(5*MET.w+c.r*c.offS/60*MET.w+c.r*c.onS/60*MET.r+5*MET.w+10*(yo?MET.p:MET.y))*kg/60;
    return {title,sub,cls,timer,segs,km:Math.round(km*10)/10,min:segs.reduce((a,s)=>a+s[1],0),kcal:Math.round(kc)};}
  if(ex.kind==="weights"){const pm=st===1?12:20, dm=danceMin(n), bl=blocksDance(n);
    title="Pesas "+ex.L; sub="+ "+ex.dance[0].toUpperCase()+ex.dance.slice(1); cls=ex.L==="C"?"c-yel":"c-pink"; timer="weights";
    segs=[["Calentamiento",6,"m","w","Marcha y movilidad"],["Pesas "+ex.L,pm,"s","s",setsOf(n)+" · 6 ejercicios"],["Pausa e hidratación",2,"x","p"],["Baile: "+ex.dance,dm,"d","d",bl.map(b=>b[0].replace("Baile: ","")+" "+b[1]/60+"′").join(" · ")],["Marcha suave",4,"m","w"]];
    const kc=segs.reduce((a,s)=>a+s[1]*MET[s[2]],0)*kg/60;
    return {title,sub,cls,timer,segs,km:0,min:segs.reduce((a,s)=>a+s[1],0),kcal:Math.round(kc)};}
  segs=[["Paseo recreativo (opcional)",15,"w","w","10–20 min, sin objetivo"]];
  return {title:"Recuperación",sub:"Sin pesas, trote ni baile",cls:"hatch",timer:"",segs,km:Math.round(15*5/60*10)/10,min:15,kcal:Math.round(15*MET.w*kg/60)};
}
/* diagrama semanal: actividades (filas) × días lunes–domingo (columnas) */
function weekGantt(mw,d,kg){
  const dayN=i=>(mw-1)*7+i+1, c=CARDIO[mw], cw=d>=dayN(0)&&d<=dayN(6)?wdOf(d):-1;
  const pm=mw===1?12:20, dm=danceMin(dayN(1)), sets=setsOf(dayN(1)).replace(/ series? × /,"×"), iv=c.r+"×("+c.on.replace(" min","′").replace(" s","″")+"+"+c.off.replace(" min","′").replace(" s","″")+")";
  const ROWS=[
   ["A","Caminata/trote","#3B6EE8",{0:[iv,c.base-10],2:[iv,c.base-10],4:[iv,c.base-10]}],
   ["B","Pesas","#D9467F",{1:["A · "+sets,pm+8],3:["B · "+sets,pm+8],5:["C · "+sets,pm+8]}],
   ["C","Bailoterapia","#C77A0A",{1:["Merengue",dm+4],3:["Salsa",dm+4],5:["Mezcla latina",dm+4]}],
   ["D","Yoga / pilates","#8B5CF6",{0:["Yoga Y1",10],2:["Pilates P1",10],4:["Yoga Y2",10]}],
   ["E","Recuperación","#1F9D55",{6:["Paseo opcional",15]}]];
  const MD=Array.from({length:7},(_,i)=>movDay(dayN(i),kg));
  return `<div class="wg"><div class="wg-in">
   <div class="wg-row wg-head"><span></span>${WD.map((w,i)=>`<span class="${i===cw?"on":""}">${w}<small>día ${dayN(i)}</small></span>`).join("")}</div>
   ${ROWS.map(([L,name,col,cells])=>{const tot=Object.values(cells).reduce((a,x)=>a+x[1],0);return `<div class="wg-row"><div class="who"><b style="background:${col}">${L}</b><span>${name}<br><span class="mini" style="text-transform:none;letter-spacing:0;font-weight:600">${tot} min/semana</span></span></div>
     ${WD.map((_,i)=>cells[i]?`<div class="wg-cell"><div class="wg-bar ${i===cw?"cur":""}" style="background:${col}" title="${WD[i]}: ${name}, ${cells[i][0]}, ${cells[i][1]} min"><span>${cells[i][0]}</span><strong>${cells[i][1]}′</strong></div></div>`:`<div class="wg-cell"></div>`).join("")}</div>`}).join("")}
   <div class="wg-row wg-foot"><span>Total del día</span>${MD.map((x,i)=>`<span class="${i===cw?"on":""}"><b>${x.min} min</b><small>${x.kcal} kcal${x.km?" · "+NF1.format(x.km)+" km":""}</small></span>`).join("")}</div>
   ${cw>=0?`<div class="wg-now" style="left:calc(190px + (100% - 190px) * ${(cw+.5)/7})"></div>`:""}
  </div></div>`;
}

     <div class="wstats"><span>${ico("clock")}${x.min} min</span><span>${ico("run")}${x.km?NF1.format(x.km)+" km":"—"}</span><span>${ico("flame")}${x.kcal} kcal</span></div>

    {id:"ocio",name:"Ocio y pareja",color:"#8B5CF6",op:"gasto"},{id:"ahorro",name:"Ahorro e inversión",color:"#4B4FE8",op:"aporte"}]};
  const f=state.fin; f.cats=f.cats||[]; f.tx=f.tx||[]; if(f.cur==null) f.cur="$"; if(f.init==null) f.init=0; return f;
}
let finLastCat=null, finYM=null, finSel=isoOf(new Date()), catOpen=false;

const moneyC=n=>(n<0?"−":"+")+fin().cur+NFC.format(Math.abs(n));

const cashOf=t=>t.op==="ingreso"||t.op==="retiro"?t.amt:-t.amt;

function startPreset(k,dOver){
  const d=dOver||state.day, st=stageOf(d), m=x=>x*60;
  let name, segs;
  if(k==="mind"){name="Mindset";segs=[["Llegar y poner la pieza",60],["Responder",300],["Elegir una acción",120]];}
  else if(k==="emo"){name="Gestión emocional";segs=[["Práctica del día",300]];}
  else if(k==="eng"){const em=engMin(d),sp=engSplit(em);name="Inglés, "+em+" min";segs=[["Repaso",m(sp[0])],["Conversación",m(sp[1])],["Corrección y dos frases",m(sp[2])]];}
  else if(k==="work"){name="Trabajo protegido";segs=WORKSEG.map(([n,x])=>[n,m(x)]);}
  else if(k==="cardio"){const c=CARDIO[st];name="Caminata/trote, etapa "+st;segs=[["Caminar suave",300]];for(let i=1;i<=c.r;i++){segs.push(["Trote "+i+"/"+c.r,c.onS]);segs.push(["Caminar "+i+"/"+c.r,c.offS]);}segs.push(["Caminata muy suave",300]);}
  else if(k==="weights"){const ex=exercise(d);name="Pesas "+(ex.L||"")+" + baile";segs=[["Calentamiento",360],["Pesas: a tu ritmo (descansa 60–90 s)",m(st===1?12:20)],["Transición e hidratación",120]];blocksDance(d).forEach(x=>segs.push(x));segs.push(["Marcha suave",240]);}
  else if(k==="dance"){name="Bailoterapia";segs=blocksDance(d);}
  else if(k==="y1"){name="Yoga Y1";segs=[["Respiración sentada",120],["Gato-vaca pequeño",120],["Postura del niño o descanso sentada",120],["Pantorrilla lado 1",60],["Pantorrilla lado 2",60],["Observación del cuerpo",120]];}
  else if(k==="p1"){name="Pilates P1";segs=[["Respiración y costillas",120],["Basculación pélvica",120],["Deslizar talones",120],["Apertura rodilla lado 1",60],["Apertura rodilla lado 2",60],["Descanso",120]];}
  else if(k==="y2"){name="Yoga Y2";segs=[["Postura erguida",60],["Movilidad de hombros",60],["Inclinación lado 1",60],["Inclinación lado 2",60],["Rodilla al pecho 1",60],["Rodilla al pecho 2",60],["Pantorrilla 1",60],["Pantorrilla 2",60],["Descanso",120]];}
  T={name,segs,i:0,left:segs[0][1],run:true,last:Date.now()}; drawTimer(); $("#timer").classList.add("on");

function blocksDance(d){const st=stageOf(d),w=wdOf(d);
  const names=w===3?["Paso lateral","Paso básico corto","Brazos con paso lateral","Marcha"]:w===5?["Marcha con música latina","Merengue suave","Salsa corta","Marcha"]:["Marcha al ritmo","Pasos laterales","Adelante/atrás","Marcha"];
  const dur=st===1?[2,2,2,2]:st===4?[3,3,3,3]:[2,3,3,2]; return names.map((n,i)=>["Baile: "+n,dur[i]*60]);}

function drawTimer(){ if(!T) return; const s=T.segs[T.i], mm=Math.floor(T.left/60), ss=Math.floor(T.left%60);
  $("#tmName").textContent=T.name+" · "+(T.i+1)+"/"+T.segs.length; $("#tmSeg").textContent=s[0];
  $("#tmClock").textContent=String(mm).padStart(2,"0")+":"+String(ss).padStart(2,"0");
  $("#tmBar").style.width=(100-T.left/s[1]*100)+"%"; $("#tmPause").textContent=T.run?"Pausar":"Seguir";}
function nextSeg(){ T.i++; if(T.i>=T.segs.length){ beep(); $("#tmSeg").textContent="¡Listo!"; $("#tmClock").textContent="00:00"; T.run=false; T.done=true; return;} T.left=T.segs[T.i][1]; beep(); }
setInterval(()=>{ if(!T||!T.run) return; const now=Date.now(); T.left-=(now-T.last)/1000; T.last=now; if(T.left<=0) nextSeg(); if(!T.done) drawTimer(); },250);
$("#tmPause").onclick=()=>{ if(!T||T.done) return; T.run=!T.run; T.last=Date.now(); drawTimer(); };
$("#tmSkip").onclick=()=>{ if(!T||T.done) return; nextSeg(); T.last=Date.now(); if(!T.done) drawTimer(); };
$("#tmStop").onclick=()=>{ T=null; $("#timer").classList.remove("on"); };

applyTheme();
{const td=todayDay(); if(td) state.day=td;}
renderAll();
</script>
