<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>30 días para ti y los tuyos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9EBF4; --shell:#F6F7FB; --paper:#FFFFFF; --ink:#1A1C2B; --soft:#6F7490; --faint:#A3A8BE; --line:#E6E8F1;
  --pri:#4B4FE8; --pri-2:#ECECFF; --pri-ink:#FFFFFF;
  --good:#1F9D55; --good-2:#D9F7E3; --bad:#E5484D; --bad-2:#FFE1E1;
  /* pastel tiles (education / salesforce references) */
  --t-rose:#F5CFCF; --t-peach:#FADFBF; --t-lav:#DAD6F8; --t-mint:#CDEEDD; --t-yel:#F1E15A; --t-pink:#EFC7EE; --t-sky:#D4E4FA; --t-grey:#E8E8E3;
  --ac-rose:#D2486A; --ac-peach:#D9812E; --ac-lav:#6A5AE0; --ac-mint:#23976A; --ac-yel:#8A7A00; --ac-pink:#B04BAE; --ac-sky:#2F6FD1;
  --shadow:0 1px 2px rgba(26,28,43,.04),0 10px 30px -18px rgba(40,44,90,.28);
  --tip:#16171F; --tip-ink:#FFFFFF;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C0D14; --shell:#12131C; --paper:#1A1C28; --ink:#ECEDF6; --soft:#A2A6C0; --faint:#6D7190; --line:#2A2D3D;
  --pri:#8487FF; --pri-2:#26284A; --pri-ink:#0C0D14;
  --good:#5AD08A; --good-2:#16301F; --bad:#FF7A7E; --bad-2:#3A1C1F;
  --t-rose:#3A2429; --t-peach:#3A2D1D; --t-lav:#29264A; --t-mint:#18342A; --t-yel:#3A3510; --t-pink:#37213A; --t-sky:#1B2A42; --t-grey:#262833;
  --ac-rose:#F08AA2; --ac-peach:#F2AE6A; --ac-lav:#A9A0FF; --ac-mint:#6CD6A6; --ac-yel:#E6D45A; --ac-pink:#E591E3; --ac-sky:#86B2F2;
  --shadow:0 0 0 1px rgba(255,255,255,.03); --tip:#ECEDF6; --tip-ink:#12131C; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0C0D14; --shell:#12131C; --paper:#1A1C28; --ink:#ECEDF6; --soft:#A2A6C0; --faint:#6D7190; --line:#2A2D3D;
  --pri:#8487FF; --pri-2:#26284A; --pri-ink:#0C0D14;
  --good:#5AD08A; --good-2:#16301F; --bad:#FF7A7E; --bad-2:#3A1C1F;
  --t-rose:#3A2429; --t-peach:#3A2D1D; --t-lav:#29264A; --t-mint:#18342A; --t-yel:#3A3510; --t-pink:#37213A; --t-sky:#1B2A42; --t-grey:#262833;
  --ac-rose:#F08AA2; --ac-peach:#F2AE6A; --ac-lav:#A9A0FF; --ac-mint:#6CD6A6; --ac-yel:#E6D45A; --ac-pink:#E591E3; --ac-sky:#86B2F2;
  --shadow:0 0 0 1px rgba(255,255,255,.03); --tip:#ECEDF6; --tip-ink:#12131C; color-scheme:dark;}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
h1,h2,h3,h4{line-height:1.2;margin:0;letter-spacing:-.015em}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px;border-radius:8px}
a{color:var(--pri);font-weight:600}
svg.i{width:18px;height:18px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- app shell (sidebar + main) ---------- */
.app{max-width:1360px;margin:18px auto;background:var(--shell);border-radius:28px;display:grid;grid-template-columns:248px 1fr;min-height:calc(100vh - 36px);box-shadow:var(--shadow)}
aside.side{padding:18px;position:sticky;top:18px;align-self:start;height:calc(100vh - 36px);display:flex;flex-direction:column}
.sidecard{background:var(--paper);border-radius:22px;padding:18px 14px;height:100%;display:flex;flex-direction:column;gap:6px;overflow:auto;scrollbar-width:none}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px;padding:2px 8px 14px}
.logo .mk{width:36px;height:36px;border-radius:11px;background:var(--pri);color:var(--pri-ink);display:grid;place-items:center;font-size:14px;font-weight:800}
.logo small{display:block;font-weight:500;font-size:11.5px;color:var(--soft)}
.sec{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:10px 10px 4px}
nav.tabs{display:flex;flex-direction:column;gap:3px}
nav.tabs button{display:flex;align-items:center;gap:11px;border:0;background:transparent;padding:10px 12px;border-radius:13px;font-size:14px;font-weight:600;color:var(--soft);text-align:left;white-space:nowrap}
nav.tabs button:hover{background:var(--shell);color:var(--ink)}
nav.tabs button[aria-selected="true"]{background:var(--pri);color:var(--pri-ink);box-shadow:0 10px 20px -10px var(--pri)}
.promo{margin-top:auto;background:#121320;color:#fff;border-radius:18px;padding:16px;position:relative;overflow:hidden}
.promo::after{content:"";position:absolute;right:-30px;bottom:-40px;width:120px;height:120px;border-radius:50%;border:18px solid rgba(255,255,255,.06)}
.promo .ico{width:30px;height:30px;border-radius:9px;background:#fff;color:#121320;display:grid;place-items:center;margin-bottom:10px}
.promo b{font-size:28px;font-weight:800;display:block;line-height:1}
.promo p{margin:4px 0 12px;font-size:12.5px;opacity:.72}
.promo button{width:100%;border:0;border-radius:12px;background:var(--pri);color:#fff;padding:9px;font-weight:700;font-size:13.5px;position:relative;z-index:1}
:root[data-theme="dark"] .promo{background:#232540}

main{padding:22px 26px 100px 8px;min-width:0}
header.top{display:flex;align-items:center;gap:14px;margin-bottom:20px}
header.top h1{font-size:26px;font-weight:800}
header.top .sub{color:var(--soft);font-size:13px;margin-top:2px}
.spacer{flex:1}
.iconbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--paper);display:grid;place-items:center;color:var(--ink)}
.me{display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:4px 14px 4px 4px}
.me .av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--t-pink),var(--t-lav));display:grid;place-items:center;font-weight:800;font-size:12px;color:var(--ac-lav)}
.me b{font-size:13px;display:block;line-height:1.1}.me span{font-size:11.5px;color:var(--soft)}
.sync{font-size:12px;color:var(--soft)}

section.view{display:none}
section.view.on{display:block}

/* ---------- generic blocks ---------- */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.card{background:var(--paper);border-radius:22px;padding:20px;box-shadow:var(--shadow);grid-column:span 6;position:relative;min-width:0}
.card.wide{grid-column:span 12}
.hero .card{grid-column:auto}
.gcol{grid-column:span 4;display:grid;gap:16px;align-content:start}.gcol .card{grid-column:auto}.card.third{grid-column:span 4}.card.two{grid-column:span 8}
.card.done{opacity:.66}
.card .hd{display:flex;align-items:flex-start;gap:12px;margin-bottom:10px}
.card h3{font-size:17px;font-weight:700}
.card .hd h3{flex:1}
.card h3 small,.card .cap{display:block;font-weight:500;font-size:12.5px;color:var(--soft);margin-top:3px;letter-spacing:0}
.card p{margin:.4em 0}
.card ol,.card ul{margin:.3em 0;padding-left:1.2em}
.card li{margin:.25em 0}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px 3px 4px;margin-bottom:10px;background:var(--paper);color:var(--ink)}
.tag .ic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--shell)}
.tag .ic svg.i{width:13px;height:13px}
.lbl{font-weight:700}
.mini{font-size:12.5px;color:var(--soft)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:8px 14px;font-size:13.5px;font-weight:600}
.btn.primary{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.btn.dark{background:var(--ink);color:var(--paper);border-color:var(--ink)}
textarea,input[type=date],input[type=text]{width:100%;font:inherit;font-size:14px;color:var(--ink);background:var(--shell);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
textarea{min-height:76px;resize:vertical}
.h2{font-size:clamp(24px,3.4vw,34px);font-weight:800;margin:0 0 4px}
.lead{color:var(--soft);max-width:78ch;margin:0 0 20px}
.select{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:600;color:var(--soft);background:var(--paper)}

/* pastel tiles (text stays ink, accents are decorative) */
.pt{box-shadow:none}
.pt .tag{background:rgba(255,255,255,.72)}
:root[data-theme="dark"] .pt .tag{background:rgba(255,255,255,.08)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pt .tag{background:rgba(255,255,255,.08)}}
.pt .btn{background:rgba(255,255,255,.6);border-color:transparent}
.pt .btn.primary{background:var(--ink);color:var(--paper)}
.pt textarea,.pt input[type=text]{background:rgba(255,255,255,.55);border-color:transparent}
:root[data-theme="dark"] .pt .btn,:root[data-theme="dark"] .pt textarea,:root[data-theme="dark"] .pt input[type=text]{background:rgba(255,255,255,.06)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pt .btn,:root:not([data-theme="light"]) .pt textarea,:root:not([data-theme="light"]) .pt input[type=text]{background:rgba(255,255,255,.06)}}
.c-rose{background:var(--t-rose)}.c-rose .tag .ic{color:var(--ac-rose)}
.c-peach{background:var(--t-peach)}.c-peach .tag .ic{color:var(--ac-peach)}
.c-lav{background:var(--t-lav)}.c-lav .tag .ic{color:var(--ac-lav)}
.c-mint{background:var(--t-mint)}.c-mint .tag .ic{color:var(--ac-mint)}
.c-yel{background:var(--t-yel)}.c-yel .tag .ic{color:var(--ac-yel)}
.c-pink{background:var(--t-pink)}.c-pink .tag .ic{color:var(--ac-pink)}
.c-sky{background:var(--t-sky)}.c-sky .tag .ic{color:var(--ac-sky)}
.c-grey{background:var(--t-grey)}.c-grey .tag .ic{color:var(--soft)}
.c-white .tag{background:var(--shell)} .c-white .tag .ic{background:var(--paper);color:var(--pri)}

/* round check button */
.check{flex:0 0 auto;width:40px;height:40px;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--ink) 18%,transparent);background:rgba(255,255,255,.55);display:grid;place-items:center;color:var(--ink)}
.c-white .check{background:var(--shell)}
.check svg{width:18px;height:18px;opacity:.18;transition:.2s}
.check[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.check[aria-pressed="true"] svg{opacity:1}

/* ---------- HOY ---------- */
.pills{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 14px;margin-bottom:6px;scrollbar-width:thin}
.pills button{flex:0 0 auto;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 12px 4px 4px;position:relative}
.pills button b{width:30px;height:30px;border-radius:50%;background:var(--shell);display:grid;place-items:center;font-size:13px;font-weight:800}
.pills button span.w{font-size:12px;color:var(--soft);font-weight:600}
.pills button .ring{width:22px;height:22px;border-radius:50%;background:conic-gradient(var(--pri) calc(var(--p)*1%),var(--line) 0);-webkit-mask:radial-gradient(circle,transparent 6px,#000 7px);mask:radial-gradient(circle,transparent 6px,#000 7px)}
.pills button[aria-current="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.pills button[aria-current="true"] b{background:var(--paper);color:var(--ink)}
.pills button[aria-current="true"] span.w{color:var(--paper);opacity:.75}
.pills button.today::after{content:"";position:absolute;top:2px;left:26px;width:8px;height:8px;border-radius:50%;background:var(--bad);border:2px solid var(--paper)}

.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin-bottom:16px;align-items:stretch}
.hero .ht{padding:6px 4px}
.hero .eyebrow{font-size:13px;font-weight:700;color:var(--pri);display:flex;align-items:center;gap:8px}
.hero h1{font-size:clamp(32px,4.6vw,54px);font-weight:700;letter-spacing:-.035em;line-height:1.02;margin:8px 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;border-radius:999px;padding:6px 12px;background:var(--paper);border:1px solid var(--line)}
.chip.stage{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.meta{color:var(--soft);font-size:13.5px;margin-bottom:12px}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px}
.kpi{background:var(--paper);border-radius:22px;padding:16px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.kpi .ib{width:40px;height:40px;border-radius:13px;background:var(--shell);display:grid;place-items:center;color:var(--ink)}
.kpi .lb{font-size:13px;font-weight:600;color:var(--soft)}
.kpi .v{font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1}
.kpi .v small{font-size:12.5px;font-weight:500;color:var(--soft);letter-spacing:0;margin-left:6px}
.kpi.fill{background:var(--pri);color:var(--pri-ink);box-shadow:0 18px 30px -18px var(--pri)}
.kpi.fill .ib{background:rgba(255,255,255,.95);color:#4B4FE8}
.kpi.fill .lb,.kpi.fill .v small{color:inherit;opacity:.82}
.badge{font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--good-2);color:var(--good);white-space:nowrap}
.badge.neutral{background:var(--shell);color:var(--soft)}
.kpi.fill .badge{background:rgba(255,255,255,.9);color:#1F9D55}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:6px;background:var(--pri);transition:width .35s}
.kpi.fill .bar{background:rgba(255,255,255,.28)} .kpi.fill .bar i{background:#fff}

.music{display:inline-flex;gap:8px;align-items:center;font-size:12.5px;font-weight:600;background:rgba(255,255,255,.6);border-radius:999px;padding:5px 12px 5px 5px;margin-bottom:10px}
.music .dot{width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-size:11px}
:root[data-theme="dark"] .music{background:rgba(255,255,255,.06)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .music{background:rgba(255,255,255,.06)}}
.quote{font-size:21px;font-weight:700;line-height:1.3;letter-spacing:-.02em;margin:4px 0 12px}
.bubbles{display:flex;flex-direction:column;gap:8px;margin:6px 0 4px}
.bubbles span{align-self:flex-start;background:var(--tip);color:var(--tip-ink);border-radius:14px 14px 14px 4px;padding:8px 13px;font-weight:600;font-size:14px;max-width:100%}
.bubbles span:nth-child(2){align-self:center}
.bubbles span:nth-child(3){align-self:flex-end;border-radius:14px 14px 4px 14px;background:var(--pri);color:var(--pri-ink)}
.segbar{display:flex;gap:3px;height:34px;margin:6px 0 10px}
.segbar i{border-radius:9px;display:block;position:relative}
.segbar i.w{background:var(--t-sky)} .segbar i.r{background:var(--pri)} .segbar i.y{background:var(--t-lav)} .segbar i.d{background:var(--t-peach)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--soft);font-weight:600}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend span::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--c)}
.steps{list-style:none;padding:0!important;margin:6px 0!important;display:grid;gap:6px}
.steps li{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;margin:0!important}
.steps li::before{content:attr(data-n);width:28px;height:28px;border-radius:50%;background:var(--shell);display:grid;place-items:center;font-size:12px;font-weight:800}
.pt .steps li::before{background:rgba(255,255,255,.65)}
.kv{display:grid;gap:8px;margin:4px 0}
.kv div{background:rgba(255,255,255,.55);border-radius:14px;padding:9px 12px}
:root[data-theme="dark"] .kv div{background:rgba(255,255,255,.05)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .kv div{background:rgba(255,255,255,.05)}}
.kv .lbl{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--soft)}
.skinline{display:grid;grid-template-columns:48px 1fr;gap:10px;margin:6px 0;align-items:start}
.skinline b{background:var(--ink);color:var(--paper);border-radius:10px;text-align:center;font-size:12px;padding:4px 0}
.note{background:rgba(255,255,255,.6);border-radius:12px;padding:9px 12px;font-size:13.5px;margin-top:8px}
.warn{background:var(--bad-2);border-radius:16px;padding:12px 14px;font-size:14px;border-left:4px solid var(--bad)}
.subchecks{display:flex;gap:8px;margin-top:10px}
.subchecks button{flex:1;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:8px;font-size:13.5px;font-weight:600}
.pt .subchecks button{background:rgba(255,255,255,.55);border-color:transparent}
.subchecks button[aria-pressed="true"]{background:var(--ink)!important;color:var(--paper);border-color:var(--ink)}

/* ---------- MES ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.stat{border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:2px}
.stat .ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;margin-bottom:10px}
.stat .ic svg.i{width:17px;height:17px}
.stat b{font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.stat span{font-size:13px;font-weight:600}
.stat em{font-style:normal;font-size:11.5px;color:var(--soft)}
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.month .wd{font-size:12px;color:var(--soft);text-align:center;font-weight:700}
.mcell{min-width:0;background:var(--shell);border:1px solid transparent;border-radius:16px;padding:9px;min-height:92px;text-align:left;display:flex;flex-direction:column;gap:4px}
.mcell:hover{border-color:var(--line);background:var(--paper)}
.mcell b{font-size:18px;font-weight:800;line-height:1;display:flex;align-items:center;gap:6px}
.mcell small{font-size:11px;color:var(--soft);line-height:1.25}
.mcell .pbar{margin-top:auto;height:5px;border-radius:5px;background:var(--line);overflow:hidden}
.mcell .pbar i{display:block;height:100%;background:var(--pri)}
.mcell.full{background:var(--pri-2);border-color:var(--pri)}
.mcell.cur{background:var(--ink);color:var(--paper)}
.mcell.cur small{color:var(--paper);opacity:.7}
.today-dot{width:8px;height:8px;border-radius:50%;background:var(--bad);display:inline-block}
.cols{display:flex;align-items:flex-end;gap:clamp(1px,.6vw,5px);height:170px;padding:0 0 0 34px;position:relative;margin-top:10px}
.cols .gl{position:absolute;left:34px;right:0;border-top:1px dashed var(--line);font-size:10.5px;color:var(--faint)}
.cols .gl span{position:absolute;left:-34px;top:-8px}
.cols .col{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;position:relative;z-index:1;border:0;background:transparent;padding:0}
.cols .col i{width:100%;max-width:14px;border-radius:4px 4px 0 0;background:var(--pri);display:block;min-height:3px}
.cols .col.zero i{background:var(--line)}
.cols .col.cur i{background:var(--ink)}
.cols .col small{font-size:9.5px;color:var(--faint)}
.cols .col:hover .tt{display:block}
.cols .tt{display:none;position:absolute;bottom:calc(100% - 20px);left:50%;transform:translateX(-50%);background:var(--tip);color:var(--tip-ink);font-size:11.5px;font-weight:600;border-radius:10px;padding:5px 9px;white-space:nowrap;z-index:5}
.rings{display:grid;grid-template-columns:1fr;gap:18px;justify-items:center}
.view>.h2{display:none}
.rings svg{width:170px;height:170px}
.rlist{display:grid;gap:10px;width:100%}
.rlist div{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;font-size:13.5px;font-weight:600}
.rlist div::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--c)}
.tp{width:100%;border-collapse:collapse;font-size:13.5px}
.tp th{font-size:11.5px;color:var(--faint);font-weight:600;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
.tp td{padding:11px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tp td.n{color:var(--faint);font-weight:700;width:40px}
.tp .track{height:5px;border-radius:5px;background:var(--line);overflow:hidden;min-width:80px}
.tp .track i{display:block;height:100%;border-radius:5px}
.opill{display:inline-block;font-size:11.5px;font-weight:700;border:1.5px solid var(--c);color:var(--ink);border-radius:8px;padding:1px 8px;background:color-mix(in srgb,var(--c) 12%,transparent);min-width:48px;text-align:center}

/* ---------- gantt (movimiento, trabajo) ---------- */
.gantt{position:relative;overflow-x:auto}
.gantt .inner{min-width:640px}
.gantt .scale{display:grid;grid-template-columns:190px repeat(30,1fr);font-size:10.5px;color:var(--faint);font-weight:600;margin-bottom:22px}
.gantt .scale span{text-align:center}
.gantt .grow{display:grid;grid-template-columns:190px repeat(30,1fr);align-items:center;margin:10px 0;position:relative}
.gantt .who{display:flex;align-items:center;gap:10px;background:var(--paper);border-radius:999px;padding:5px 12px 5px 5px;box-shadow:var(--shadow);margin-right:14px;min-width:0}
.gantt .who b{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:13px;flex:0 0 auto}
.gantt .who span{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;line-height:1.2}
.gantt .gbar{height:46px;border-radius:999px;display:flex;align-items:center;gap:10px;padding:0 16px 0 8px;color:#fff;position:relative;overflow:hidden;font-size:12px}
.gantt .gbar .kn{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.95);flex:0 0 auto}
.gantt .gbar strong{margin-left:auto;font-size:20px;font-weight:800}
.gantt .gbar.cur{outline:3px solid var(--ink);outline-offset:2px}
.gantt .vline{position:absolute;top:-4px;bottom:0;width:2px;background:var(--bad);z-index:2;border-radius:2px}
.gantt .vline::before{content:"Hoy";position:absolute;top:-20px;left:50%;transform:translateX(-50%);background:var(--bad);color:#fff;font-size:10px;font-weight:700;border-radius:6px;padding:1px 6px}
.gx{display:flex;height:46px;border-radius:999px;overflow:hidden;gap:3px;margin:10px 0}
.gx div{display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;color:#fff;min-width:0;white-space:nowrap;overflow:hidden}

/* kanban (salesforce / task management) */
.kanban{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.kcol h4{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);text-align:center;margin:0 0 10px}
.kcol .kline{height:4px;border-radius:4px;margin-bottom:12px}
.kcard{border-radius:20px;padding:14px 16px;min-width:0}
.kcard h3{font-size:15px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.kcard .more{width:28px;height:28px;border-radius:50%;border:1px solid color-mix(in srgb,var(--ink) 15%,transparent);display:grid;place-items:center;font-size:13px;flex:0 0 auto}
.kitem{display:flex;gap:10px;align-items:flex-start;background:rgba(255,255,255,.62);border-radius:12px;padding:8px 10px;margin:7px 0;font-size:13px}
:root[data-theme="dark"] .kitem{background:rgba(255,255,255,.05)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .kitem{background:rgba(255,255,255,.05)}}
.kitem .av{width:24px;height:24px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff}
.kitem b{font-weight:700}
.dashes{display:flex;gap:4px;margin:10px 0 4px}
.dashes i{flex:1;height:3px;border-radius:3px;background:color-mix(in srgb,var(--ink) 18%,transparent)}
.dashes i.on{background:var(--ink)}
.dashes i.half{background:linear-gradient(90deg,var(--ink) 50%,color-mix(in srgb,var(--ink) 18%,transparent) 50%)}

/* tile board (pareja / familia / thomas) */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.tile{border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:6px;min-height:150px;min-width:0}
.tile .th{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.tile h4{font-size:14px;font-weight:700;line-height:1.25}
.tile .num{font-size:11.5px;font-weight:700;color:var(--soft)}
.tile p{margin:0;font-size:12.5px;color:var(--soft)}
.tile .ft{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px}
.tile .check{width:34px;height:34px}
.tile.ok{outline:2px solid var(--ink);outline-offset:-2px}
.tile.hatch{background:repeating-linear-gradient(135deg,var(--shell) 0 8px,var(--line) 8px 10px)}
.pill{font-size:11.5px;border-radius:999px;padding:2px 9px;background:var(--bad-2);color:var(--bad);font-weight:700;white-space:nowrap}
.pill.home{background:var(--good-2);color:var(--good)}
.pill.ink{background:var(--ink);color:var(--paper)}

/* course cards (familia / mente) */
.courses{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.course{border-radius:22px;padding:16px 18px;min-height:170px;display:flex;flex-direction:column;gap:8px;min-width:0}
.course .ch{display:flex;align-items:center;gap:8px}
.course .ch .ic{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.85);display:grid;place-items:center}
:root[data-theme="dark"] .course .ch .ic{background:rgba(255,255,255,.08)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .course .ch .ic{background:rgba(255,255,255,.08)}}
.course .ch span{font-size:12.5px;font-weight:600}
.course .ch .score{margin-left:auto;background:rgba(255,255,255,.85);border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700}
:root[data-theme="dark"] .course .ch .score{background:rgba(255,255,255,.08)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .course .ch .score{background:rgba(255,255,255,.08)}}
.course h3{font-size:20px;font-weight:600;letter-spacing:-.02em;line-height:1.2}
.course .ft{margin-top:auto;display:flex;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--soft);font-weight:600}
.dots{display:flex;gap:3px}
.dots i{width:9px;height:9px;border-radius:50%;background:color-mix(in srgb,var(--ink) 18%,transparent)}
.dots i.on{background:var(--ink)}

/* lists */
.list-plain{list-style:none;padding:0!important;margin:0!important}
.list-plain li{padding:11px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;margin:0!important}
.pt .list-plain li{border-color:color-mix(in srgb,var(--ink) 10%,transparent)}
.list-plain li:last-child{border-bottom:0}
.list-plain li .n{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--shell);font-weight:800;font-size:13px;color:var(--soft)}
.pt .list-plain li .n{background:rgba(255,255,255,.6)}
.list-plain li.ok .n{background:var(--ink);color:var(--paper)}
.list-plain .check{width:34px;height:34px}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:10px 8px;text-align:left;vertical-align:top}
.tbl th{font-size:11.5px;color:var(--faint);font-weight:600}
.tbl tr.cur td{background:var(--pri-2)}
.tbl tr.cur td:first-child{border-radius:10px 0 0 10px}.tbl tr.cur td:last-child{border-radius:0 10px 10px 0}
.scroll{overflow-x:auto}
.vbars{display:flex;align-items:flex-end;gap:14px;height:160px;margin:16px 0 6px}
.vbars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.vbars i{width:100%;max-width:34px;border-radius:8px 8px 3px 3px;background:var(--t-lav);display:block}
.vbars div.cur i{background:var(--pri)}
.vbars b{font-size:12.5px}.vbars small{font-size:11px;color:var(--soft)}

/* piel */
.skincal{display:grid;grid-template-columns:repeat(10,1fr);gap:8px}
.skd{border:0;border-radius:14px;padding:8px 4px;font-size:12px;background:var(--shell);text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.skd b{font-size:15px;font-weight:800}
.skd.cur{background:var(--ink);color:var(--paper)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:middle;margin:0 1px}
.d-c{background:#E7A21D} .d-g{background:#7A6CF0} .d-p{background:#E5484D} .d-b{background:var(--line);box-shadow:inset 0 0 0 1px var(--faint)}

/* timeline guía */
.tline{list-style:none;padding:0!important;margin:0!important;position:relative}
.tline::before{content:"";position:absolute;left:17px;top:8px;bottom:8px;width:2px;background:var(--line)}
.tline li{display:grid;grid-template-columns:36px 1fr;gap:14px;align-items:start;padding:8px 0;margin:0!important;position:relative}
.tline li b{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--pri);color:var(--pri-ink);font-size:13px;z-index:1}
.tline li:nth-child(2n) b{background:var(--ink);color:var(--paper)}
.tline li span{background:var(--shell);border-radius:14px;padding:9px 13px}

/* timer */
#timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--tip);color:var(--tip-ink);border-radius:24px;padding:12px 14px;display:none;align-items:center;gap:14px;width:min(600px,calc(100% - 24px));box-shadow:0 20px 40px -14px rgba(0,0,0,.5)}
#timer.on{display:flex}
#timer .tt{flex:1;min-width:0}
#timer .tt small{display:block;opacity:.7;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#timer .tt b{font-size:14.5px}
#timer .clock{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
#timer button{background:transparent;border:1px solid color-mix(in srgb,var(--tip-ink) 30%,transparent);color:var(--tip-ink);border-radius:999px;padding:6px 11px;font-size:12.5px;font-weight:600}
#timer #tmPause{background:var(--pri);border-color:var(--pri);color:#fff}
#timer .seg{height:4px;border-radius:4px;background:color-mix(in srgb,var(--tip-ink) 22%,transparent);margin-top:6px;overflow:hidden}
#timer .seg i{display:block;height:100%;background:var(--pri)}

/* ---------- finanzas ---------- */
.fnav{display:flex;align-items:center;gap:6px}
.fnav .iconbtn{width:34px;height:34px;font-size:15px}
.fnav b{min-width:150px;text-align:center;font-size:15px}
.fcal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.fcal .wd{font-size:12px;color:var(--soft);text-align:center;font-weight:700}
.fcell{background:var(--shell);border:1.5px solid transparent;border-radius:16px;padding:8px;min-height:104px;text-align:left;display:flex;flex-direction:column;gap:3px;min-width:0}
.fcell:hover{background:var(--paper);border-color:var(--line)}
.fcell.blank{background:transparent;pointer-events:none}
.fcell.sel{border-color:var(--ink);background:var(--paper)}
.fcell .dn{display:flex;align-items:center;justify-content:space-between;font-weight:800;font-size:15px}
.fcell .dn .today-dot{margin-left:4px}
.fcell.today .dn b{background:var(--pri);color:var(--pri-ink);border-radius:8px;padding:0 6px}
.fchip{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:700;border-radius:7px;padding:1px 6px;background:color-mix(in srgb,var(--c) 16%,var(--paper));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.fchip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c);flex:0 0 auto}
.fcell .more{font-size:10.5px;color:var(--soft);font-weight:600}
.fcell .net{margin-top:auto;font-size:11px;font-weight:700}
.pos{color:var(--good)} .neg{color:var(--bad)}
.fdots{display:none;gap:3px;flex-wrap:wrap}
.fdots i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.catchip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;border-radius:999px;padding:3px 10px 3px 8px;background:color-mix(in srgb,var(--c) 16%,var(--paper));white-space:nowrap}
.catchip::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c)}
.catpicks{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.catpicks label{cursor:pointer}
.catpicks input{position:absolute;opacity:0;pointer-events:none}
.catpicks input:checked+.catchip{background:var(--c);color:#fff;box-shadow:0 6px 14px -8px var(--c)}
.catpicks input:checked+.catchip::before{background:#fff}
.catpicks input:focus-visible+.catchip{outline:3px solid var(--pri);outline-offset:2px}
.frm{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.frm .full{grid-column:1/-1}
.frm label.l{font-size:11.5px;font-weight:700;color:var(--soft);display:block;margin-bottom:3px}
select,input[type=number]{width:100%;font:inherit;font-size:14px;color:var(--ink);background:var(--shell);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.txl{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:6px}
.txl li{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;background:var(--shell);border-radius:14px;padding:8px 10px}
.txl li .nt{font-size:12px;color:var(--soft);display:block;margin-top:2px}
.txl li b{font-size:14px;white-space:nowrap}
.xbtn{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--paper);display:grid;place-items:center;font-size:12px;color:var(--soft)}
.opl{font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;background:var(--shell);color:var(--soft);white-space:nowrap}
.opl.ingreso{background:var(--good-2);color:var(--good)} .opl.gasto{background:var(--bad-2);color:var(--bad)}
.opl.aporte{background:var(--pri-2);color:var(--pri)} .opl.retiro{background:var(--t-peach);color:var(--ac-peach)}
.catrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.catrow:last-child{border-bottom:0}
.sw{width:30px;height:30px;border-radius:50%;border:0;padding:0;overflow:hidden;cursor:pointer;background:var(--c)}
.sw::-webkit-color-swatch-wrapper{padding:0}.sw::-webkit-color-swatch{border:0;border-radius:50%}.sw::-moz-color-swatch{border:0;border-radius:50%}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.swatches label{cursor:pointer}
.swatches input{position:absolute;opacity:0;pointer-events:none}
.swatches span{display:block;width:30px;height:30px;border-radius:50%;background:var(--c);border:3px solid var(--paper);box-shadow:0 0 0 1.5px var(--line)}
.swatches input:checked+span{box-shadow:0 0 0 2.5px var(--ink)}
.swatches input:focus-visible+span{outline:3px solid var(--pri);outline-offset:2px}
dialog{border:0;border-radius:26px;background:var(--paper);color:var(--ink);padding:22px;width:min(560px,calc(100% - 24px));max-height:calc(100vh - 40px);box-shadow:0 30px 60px -20px rgba(0,0,0,.45)}
dialog::backdrop{background:rgba(12,13,20,.45);backdrop-filter:blur(4px)}
dialog h3{font-size:19px;font-weight:800}
.dlgsec{background:var(--shell);border-radius:18px;padding:14px;margin-top:14px}
/* semana de movimiento */
.wkboard{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:14px}
.wday{min-height:0;gap:4px}
.wday h4{font-size:15px}
.wday .wsub{font-size:12.5px;color:var(--ink);opacity:.75;margin:0}
.wsegs{list-style:none;padding:0;margin:2px 0 4px;display:grid;gap:5px}
.wsegs li{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;align-items:flex-start}
.wsegs li span{display:flex;flex-direction:column;min-width:0;padding-left:14px;position:relative;font-weight:600}
.wsegs li span i{position:absolute;left:0;top:5px;width:8px;height:8px;border-radius:50%}
.wsegs li small{font-weight:500;color:var(--soft);font-size:11.5px}
.wsegs li b{white-space:nowrap}
.wstats{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:6px}
.wstats span{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;background:rgba(255,255,255,.62);border-radius:999px;padding:3px 9px}
.wstats svg.i{width:13px;height:13px}
:root[data-theme="dark"] .wstats span{background:rgba(255,255,255,.07)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .wstats span{background:rgba(255,255,255,.07)}}
.wday.hatch .wstats span{background:var(--paper)}
.wtot{background:var(--ink);color:var(--paper)}
.wtot .num,.wtot .mini{color:var(--paper);opacity:.7}
.wbig{display:flex;flex-direction:column;border-bottom:1px solid color-mix(in srgb,var(--paper) 18%,transparent);padding:6px 0}
.wbig b{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.wbig span{font-size:12px;opacity:.75}
@media (max-width:1100px){.wkboard{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.wkboard{grid-template-columns:1fr}}
@media (min-width:861px) and (max-height:1080px){nav.tabs button{padding:8px 12px}.sec{padding-top:6px}.promo p{display:none}.promo b{font-size:22px}.promo .ico{display:none}}
/* registro */
.logup{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:12px}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;border:2px dashed color-mix(in srgb,var(--pri) 45%,var(--line));background:var(--pri-2);border-radius:18px;padding:18px;cursor:pointer;min-height:120px}
.drop:hover{border-color:var(--pri)}
.drop:focus-within{outline:3px solid var(--pri);outline-offset:2px}
.drop input{position:absolute;opacity:0;width:1px;height:1px}
.drop .dico{width:40px;height:40px;border-radius:50%;background:var(--pri);color:var(--pri-ink);display:grid;place-items:center}
.lgf{grid-template-columns:repeat(4,minmax(0,1fr))}
.wlog{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;background:var(--ink);color:var(--paper);border-radius:10px;padding:5px 8px;margin-top:6px}
.wlog svg.i{width:14px;height:14px}
@media (max-width:860px){.logup{grid-template-columns:1fr}.lgf{grid-template-columns:1fr 1fr}}
/* calendario de piel completo */
.skwk{font-size:13px;font-weight:700;color:var(--soft);margin:16px 0 8px;letter-spacing:.02em}
.skdays{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.skday{background:var(--shell);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:8px;border-top:4px solid var(--c);min-width:0}
.skday.cur{outline:2px solid var(--ink);outline-offset:-2px}
.skh{display:flex;align-items:center;gap:8px}
.skn{width:34px;height:34px;border-radius:50%;border:0;background:var(--ink);color:var(--paper);font-weight:800;font-size:14px}
.skr{display:grid;grid-template-columns:34px 1fr;gap:8px;align-items:start}
.skr>b{font-size:11px;background:var(--paper);border-radius:8px;text-align:center;padding:3px 0;margin-top:1px}
.skr ol{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:4px;counter-reset:s}
.skr li{counter-increment:s;display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;background:color-mix(in srgb,var(--c) 14%,var(--paper));border-radius:8px;padding:2px 8px 2px 3px}
.skr li::before{content:counter(s);width:16px;height:16px;border-radius:50%;background:var(--c);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center}
.sknote{margin:0;font-size:11.5px;color:var(--soft)}
/* diagrama semanal */
.wg{overflow-x:auto;margin-top:14px}
.wg-in{min-width:860px;position:relative;padding-top:4px}
.wg-row{display:grid;grid-template-columns:190px repeat(7,minmax(0,1fr));align-items:center;margin:8px 0}
.wg-row .who{display:flex;align-items:center;gap:10px;background:var(--paper);border-radius:999px;padding:5px 12px 5px 5px;box-shadow:var(--shadow);margin-right:12px;min-width:0}
.wg-row .who b{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:13px;flex:0 0 auto}
.wg-row .who span{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;line-height:1.25}
.wg-head span,.wg-foot span{text-align:center;font-size:12.5px;font-weight:700;color:var(--soft);display:flex;flex-direction:column;align-items:center;gap:1px;border-radius:12px;padding:4px 0}
.wg-head small,.wg-foot small{font-weight:500;font-size:11px;color:var(--faint)}
.wg-head span.on{color:var(--ink)}
.wg-foot{border-top:1px dashed var(--line);padding-top:8px}
.wg-foot span:first-child{align-items:flex-start;padding-left:6px}
.wg-foot b{color:var(--ink);font-size:13px}
.wg-foot span.on{background:var(--pri-2)}
.wg-cell{padding:0 4px;min-width:0}
.wg-bar{min-height:50px;border-radius:18px;display:flex;flex-direction:column-reverse;justify-content:center;gap:1px;padding:6px 12px;color:#fff;min-width:0}
.wg-bar span{font-size:11.5px;font-weight:600;line-height:1.2}
.wg-bar strong{font-size:18px;font-weight:800;line-height:1.1}
.wg-bar.cur{outline:3px solid var(--ink);outline-offset:2px}
.wg-now{position:absolute;top:44px;bottom:48px;width:2px;background:var(--bad);border-radius:2px;pointer-events:none;z-index:2}
/* avance fijo y checks pequeños */
.stick{position:sticky;top:10px;z-index:25;display:flex;justify-content:flex-end;margin:-6px 0 8px;pointer-events:none}
.stickin{pointer-events:auto;display:inline-flex;align-items:center;gap:8px;background:color-mix(in srgb,var(--paper) 86%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 6px;font-size:12px;box-shadow:0 8px 20px -14px rgba(0,0,0,.35);font-variant-numeric:tabular-nums}
.stickin .ring{width:20px;height:20px;border-radius:50%;background:conic-gradient(var(--pri) calc(var(--p)*1%),var(--line) 0);-webkit-mask:radial-gradient(circle,transparent 5.5px,#000 6.5px);mask:radial-gradient(circle,transparent 5.5px,#000 6.5px)}
.stk-parts{color:var(--soft)}
.stk-bar{width:70px;height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.stk-bar i{display:block;height:100%;background:var(--pri);border-radius:4px}
.check.sm{width:28px;height:28px}.check.sm svg{width:14px;height:14px}
.skchk{display:flex;gap:6px}
.skchk button{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:5px;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:4px 8px;font-size:12px;font-weight:700;color:var(--soft)}
.skchk button svg{width:13px;height:13px;opacity:.25}
.skchk button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.skchk button[aria-pressed="true"] svg{opacity:1}
@media (max-width:860px){.stick{top:74px}.stk-parts{display:none}}
/* mindset juego */
.mhero{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
.mquest{grid-column:auto}
.mlevel{grid-column:auto;background:var(--ink);color:var(--paper);display:flex;flex-direction:column;gap:8px}
.mlv{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1}
.mxp{display:flex;justify-content:space-between;font-size:13px;opacity:.85}
.mxp b{font-size:18px}
.mbar{background:color-mix(in srgb,var(--paper) 22%,transparent);height:8px}.mbar i{background:#8C8FFF}
.mstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:auto}
.mstats div{background:color-mix(in srgb,var(--paper) 10%,transparent);border-radius:14px;padding:10px;display:flex;flex-direction:column}
.mstats b{font-size:22px;font-weight:800}.mstats span{font-size:11.5px;opacity:.75}
.mdone[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#fff}
.mpath{position:relative;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-template-rows:repeat(5,86px);margin-top:6px}
.mpath>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.mp-all{fill:none;stroke:var(--line);stroke-width:10;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.mp-done{fill:none;stroke:var(--pri);stroke-width:10;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.mnode{position:relative;z-index:1;justify-self:center;align-self:center;border:0;background:transparent;padding:0;display:flex;flex-direction:column;align-items:center;gap:2px}
.mnode .mn{width:44px;height:44px;border-radius:50%;background:var(--paper);border:3px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:14px;color:var(--soft);transition:transform .15s}
.mnode:hover .mn{transform:scale(1.08)}
.mnode .mn svg{width:18px;height:18px}
.mnode.done .mn{background:var(--pri);border-color:var(--pri);color:#fff}
.mnode.ms .mn{border-color:#E7A21D;color:#B7790A}
.mnode.ms.done .mn{background:#E7A21D;border-color:#E7A21D;color:#fff}
.mnode.cur .mn{box-shadow:0 0 0 5px color-mix(in srgb,var(--pri) 30%,transparent);border-color:var(--ink)}
.mnode small{position:absolute;top:100%;font-size:10.5px;font-weight:700;color:var(--soft);white-space:nowrap}
.mnode em{position:absolute;bottom:100%;margin-bottom:3px;font-style:normal;font-size:10px;font-weight:800;background:var(--ink);color:var(--paper);border-radius:999px;padding:1px 7px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge2{display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px;background:var(--shell);border-radius:16px;padding:12px;opacity:.55}
.badge2 span{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--line);color:var(--soft)}
.badge2.ok{opacity:1}.badge2.ok span{background:#E7A21D;color:#fff}
.badge2 b{font-size:13px}.badge2 small{font-size:11.5px;color:var(--soft)}
/* inglés */
.qlist{margin:6px 0 8px;padding-left:1.4em;display:grid;gap:3px;font-size:14px}
.engd summary{cursor:pointer;list-style:none}
.engd summary::-webkit-details-marker{display:none}
.engd summary::after{content:" ▾";color:var(--soft)}
.engd[open] summary::after{content:" ▴"}
@media (max-width:860px){.mhero{grid-template-columns:1fr}.mpath{grid-template-rows:repeat(5,70px)}.mnode .mn{width:36px;height:36px;font-size:12px}.mnode small{display:none}}
/* family wall */
.fwc{background:var(--shell);border:1.5px solid transparent;border-radius:16px;padding:7px;min-height:118px;text-align:left;display:flex;flex-direction:column;gap:3px;min-width:0}
.fwc:hover{background:var(--paper);border-color:var(--line)}
.fwc.blank{background:transparent;pointer-events:none}
.fwc.sel{border-color:var(--ink);background:var(--paper)}
.fwc .dn{display:flex;align-items:center;justify-content:space-between;font-weight:800;font-size:15px}
.fwc.today .dn b{background:var(--pri);color:var(--pri-ink);border-radius:8px;padding:0 6px}
.fwbell{display:inline-flex;align-items:center;gap:2px;font-size:10.5px;color:var(--bad);font-weight:800}
.fwbell svg.i{width:12px;height:12px}
.fwl{font-size:11px;font-weight:600;line-height:1.25;border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 12%,var(--paper));border-radius:0 6px 6px 0;padding:1px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fwdots{display:none;gap:3px;margin-top:auto}
.fwdots i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.fwform{display:grid;gap:8px}
.fwf{display:grid;gap:4px}
.fwf>span{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700}
.fwf>span svg.i{width:15px;height:15px;color:var(--c)}
.fwf textarea{min-height:0;border-left:4px solid var(--c)!important}
.fwadd{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.fwadd input[type=text]{flex:1;min-width:160px;background:rgba(255,255,255,.6);border-color:transparent}
.fwadd input[type=date]{background:rgba(255,255,255,.6);border-color:transparent}
.fwlist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.fwlist li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:rgba(255,255,255,.62);border-radius:14px;padding:6px 8px}
.fwlist li span small{display:block;font-size:11.5px;color:var(--soft)}
.fwlist li.done span{text-decoration:line-through;opacity:.55}
.fwlist li.empty{display:block;background:transparent;padding:4px 0}
:root[data-theme="dark"] .fwlist li,:root[data-theme="dark"] .fwadd input{background:rgba(255,255,255,.06)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .fwlist li,:root:not([data-theme="light"]) .fwadd input{background:rgba(255,255,255,.06)}}
@media (max-width:860px){.fwc{min-height:60px;padding:6px;border-radius:12px}.fwc .fwl{display:none}.fwdots{display:flex}}
/* family wall v2 */
.fwlayout{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
.fwmain{display:grid;gap:16px;min-width:0}
.fwmain>.card{grid-column:auto}
.fwside{position:sticky;top:16px;min-width:0}
.fwside .card{grid-column:auto;max-height:calc(100vh - 40px);overflow:auto}
.fwform{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fwf label{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;margin-bottom:4px}
.fwf label svg.i{width:15px;height:15px;color:var(--c)}
.fwin{position:relative}
.fwin textarea{min-height:64px;border-left:4px solid var(--c)!important;padding-right:40px}
.star{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:50%;border:0;background:transparent;font-size:19px;line-height:1;color:color-mix(in srgb,var(--ink) 25%,transparent)}
.star[aria-pressed="true"]{color:#E7A21D}
.star:disabled{opacity:.3;cursor:default}
.favgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.favcol{background:color-mix(in srgb,var(--c) 8%,var(--paper));border-radius:16px;padding:10px;border-top:4px solid var(--c);min-width:0}
.favcol h4{display:flex;align-items:center;gap:6px;font-size:13px;margin:0 0 8px}
.favcol h4 svg.i{width:15px;height:15px;color:var(--c)}
.favs{display:flex;flex-wrap:wrap;gap:6px}
.favchip{display:inline-flex;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:999px;max-width:100%}
.favchip button{border:0;background:transparent;font-size:12.5px;font-weight:600;padding:4px 4px 4px 10px;text-align:left}
.favchip button:first-child::before{content:"★ ";color:#E7A21D}
.favchip .favx{padding:4px 9px 4px 4px;color:var(--faint);font-size:11px}
.checklist{list-style:none;margin:0;padding:0;display:grid}
.checklist li{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px dashed color-mix(in srgb,var(--ink) 15%,transparent);font-size:14.5px;transition:opacity .25s,transform .25s}
.checklist li.going{opacity:0;transform:translateX(20px)}
.checklist li.empty{border:0}
.cbox{width:22px;height:22px;border-radius:7px;border:2px solid color-mix(in srgb,var(--ink) 40%,transparent);background:rgba(255,255,255,.7);flex:0 0 auto;padding:0}
.cbox.on{background:var(--ink);border-color:var(--ink)}
.linkbtn{border:0;background:none;color:var(--pri);font-weight:700;text-decoration:underline;padding:0;font-size:inherit}
.bought{background:rgba(255,255,255,.6);border-radius:10px;padding:6px 10px;margin:0 0 8px}
.shopcard .fwadd input[type=text]{min-width:0}
.postits{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px;padding:6px 4px}
.postit{background:var(--pc);color:#2B2A26;border-radius:4px 4px 4px 18px;padding:14px 14px 10px;min-height:150px;display:flex;flex-direction:column;gap:8px;box-shadow:0 10px 18px -12px rgba(0,0,0,.45);transform:rotate(var(--rot,0deg));position:relative}
.postit::before{content:"";position:absolute;top:-8px;left:50%;width:54px;height:16px;transform:translateX(-50%) rotate(-2deg);background:rgba(255,255,255,.55);border-radius:2px}
.postit p{margin:0;font-family:"Caveat","Segoe Print","Comic Sans MS",cursive;font-size:23px;line-height:1.15;word-break:break-word;flex:1}
.postit.done p{text-decoration:line-through;opacity:.5}
.postit .pirow{display:flex;align-items:center;justify-content:space-between;gap:6px}
.postit .pirow>span{display:flex;gap:4px}
.postit small{font-size:11.5px;font-weight:700;color:#5A574E}
.postit small.neg{color:#B42318}
.postit .check{background:rgba(255,255,255,.55);border-color:rgba(0,0,0,.15);color:#2B2A26}
.postit .check[aria-pressed="true"]{background:#2B2A26;color:#fff;border-color:#2B2A26}
.postit .xbtn{background:rgba(255,255,255,.55);border-color:rgba(0,0,0,.12);color:#5A574E}
.postit.new textarea{flex:1;background:transparent;border:1.5px dashed rgba(0,0,0,.25);font-family:"Caveat","Segoe Print",cursive;font-size:22px;color:#2B2A26;min-height:80px}
.postit.new input[type=date]{background:rgba(255,255,255,.55);border:0;color:#2B2A26;padding:6px 8px;font-size:12px}
/* inglés: prompt */
.pbox{background:var(--paper);border:1px solid var(--line);border-radius:16px;margin:8px 0;overflow:hidden}
.pbh{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:8px 12px;background:var(--shell);border-bottom:1px solid var(--line);font-size:13px}
.pbox pre{margin:0;padding:12px;white-space:pre-wrap;word-break:break-word;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:12.5px;line-height:1.5;max-height:320px;overflow:auto}
/* ignacio */
.ignweek{margin-top:16px}
.ignweek details summary{cursor:pointer;list-style:none}
.ignweek details summary::-webkit-details-marker{display:none}
.ignd{display:grid;gap:8px;margin-top:8px}
.ignvoc{display:flex;flex-wrap:wrap;gap:6px}
.ignvoc span{background:var(--ink);color:var(--paper);border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:700}
@media (max-width:1100px){.fwlayout{grid-template-columns:1fr}.fwside{position:static}.fwside .card{max-height:none}.favgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.fwform,.favgrid{grid-template-columns:1fr}}
.swatches input.sw{position:static;opacity:1;pointer-events:auto;width:30px;height:30px;box-shadow:0 0 0 1.5px var(--line)}
.catnew{border:1.5px dashed var(--faint);background:transparent;border-radius:999px;padding:3px 12px;font-size:12.5px;font-weight:700;color:var(--soft)}
.catnew:hover{border-color:var(--pri);color:var(--pri)}
.quickcat{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:12px;margin:0 0 10px}
/* kanban trabajo */
.kbwrap{overflow-x:auto;margin:6px -4px 0;padding:0 4px 6px}
.kb{min-width:min-content;display:grid;gap:10px}
.kbrow{display:grid;grid-template-columns:var(--gc);gap:10px;align-items:stretch}
.kbhead{align-items:center;position:sticky;top:0;z-index:2}
.kbcorner{padding-left:6px;font-weight:700}
.kbcolh{display:flex;align-items:center;gap:6px;background:var(--shell);border-radius:12px;padding:6px 8px}
.kbcolh input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-weight:800;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);padding:2px}
.kbcolh input:focus{background:var(--paper);border-radius:6px}
.kbdot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.kbcount{font-size:11.5px;font-weight:800;background:var(--paper);border-radius:999px;padding:1px 8px;color:var(--soft)}
.kbcolh .xbtn{width:24px;height:24px;font-size:10px}
.kbco{background:color-mix(in srgb,var(--cc) 12%,var(--paper));border-left:5px solid var(--cc);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.kbcoh{display:flex;align-items:center;gap:8px}
.kbcoh .sw{width:26px;height:26px;flex:0 0 auto}
.kbname{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:15px;font-weight:800;color:var(--ink);padding:3px 4px;border-radius:8px}
.kbname:focus,.kbnote:focus{background:var(--paper)}
.kbprice{display:flex;align-items:center;gap:4px;background:var(--paper);border-radius:10px;padding:3px 4px 3px 10px;font-weight:800}
.kbprice input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:18px;font-weight:800;color:var(--ink);padding:4px 2px;font-variant-numeric:tabular-nums}
.kbprice select{width:auto;border:0;background:var(--shell);font-size:12px;padding:4px 6px;border-radius:8px}
.kbmeter{display:grid;gap:4px}
.kbm{height:8px;border-radius:8px;background:color-mix(in srgb,var(--ink) 10%,transparent);overflow:hidden}
.kbm i{display:block;height:100%;background:var(--cc);border-radius:8px}
.kbmt{display:flex;justify-content:space-between;gap:6px;font-size:11.5px;color:var(--soft)}
.kbmt b{color:var(--ink)}
.kbnote{border:0;background:transparent;font:inherit;font-size:12px;color:var(--soft);padding:3px 4px;border-radius:8px;width:100%}
.kbtools{display:flex;gap:4px;justify-content:flex-end;margin-top:auto}
.kbtools .xbtn{width:26px;height:26px}
.kbtools .xbtn:disabled{opacity:.35}
.kbcell{background:var(--shell);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:6px;min-height:90px;border:2px dashed transparent;transition:border-color .15s,background .15s}
.kbcell.over{border-color:var(--cc);background:color-mix(in srgb,var(--cc) 8%,var(--shell))}
.kbt{background:var(--paper);border-radius:12px;padding:8px 8px 6px 10px;border-left:4px solid var(--cc);box-shadow:0 4px 10px -8px rgba(0,0,0,.35);cursor:grab}
.kbt.dragging{opacity:.45}
.kbt.isdone .kbtt{text-decoration:line-through;color:var(--soft)}
.kbtt{font-size:13.5px;font-weight:600;line-height:1.35;outline:none;min-height:1.35em;word-break:break-word;cursor:text}
.kbtt:empty::before{content:"Escribe la tarea…";color:var(--faint);font-weight:500}
.kbtt:focus{background:var(--shell);border-radius:6px;padding:2px 4px;margin:-2px -4px}
.kbta{display:flex;gap:2px;justify-content:flex-end;margin-top:4px;opacity:.55}
.kbt:hover .kbta,.kbt:focus-within .kbta{opacity:1}
.kbta button{border:0;background:var(--shell);border-radius:7px;width:24px;height:22px;font-size:12px;color:var(--soft);padding:0}
.kbta button:disabled{opacity:.3}
.kbadd{border:1.5px dashed color-mix(in srgb,var(--ink) 18%,transparent);background:transparent;border-radius:10px;padding:6px;font-size:12.5px;font-weight:700;color:var(--soft);margin-top:auto}
.kbadd:hover{border-color:var(--cc);color:var(--ink)}
.mcell{min-height:150px}
.mcell.blank{background:transparent;pointer-events:none;border:0}
.mcell .mmon{display:inline;font-size:10.5px;font-weight:700;color:var(--soft)}
.mlines{display:flex;flex-direction:column;gap:2px;margin:3px 0 4px;min-width:0}
.ml{font-size:10.5px;line-height:1.25;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid var(--c);padding-left:4px;color:var(--ink);opacity:.85}
.ml.on{opacity:.45;text-decoration:line-through}
.mcell.cur .ml{color:var(--paper)}
@media (max-width:860px){.mlines{display:none}.mcell{min-height:60px}}
.fwl{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-size:10.5px;font-weight:500}
.fwl b{display:block;font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--c)}
.fwc{min-height:150px}
.fwmsg{margin-left:4px}.fwmsg.warn{color:var(--bad);font-weight:700}
.btn:disabled{opacity:.45;cursor:default}
nav.tabs button{white-space:normal;line-height:1.2}
/* niños */
.subtabs{display:inline-flex;gap:4px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:4px;margin:4px 0 14px}
.subtabs button{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;border-radius:999px;padding:7px 14px;font-weight:700;font-size:13.5px;color:var(--soft)}
.subtabs button[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.carelist{display:grid;gap:6px}

.pcgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}

.pcitem .cbox{width:18px;height:18px;border-radius:6px}
.pcrule{display:grid;grid-template-columns:32px minmax(0,2fr) minmax(0,1fr) auto;gap:8px;align-items:center;margin-bottom:6px}

@media (max-width:1100px){.shopgrid{grid-template-columns:1fr}.czgroups{grid-template-columns:1fr}}
@media (max-width:860px){.cz-frm{grid-template-columns:1fr 1fr}.czlist li{grid-template-columns:auto minmax(0,1fr) 90px auto}.czlist li .mvsel{grid-column:2/-1;margin-left:0}.cztasks li{grid-template-columns:auto minmax(0,1fr) auto}.cztasks li>input[type=date],.cztasks li>.mvsel{grid-column:2/-1;margin-left:0}.carerow{grid-template-columns:40px 1fr}.csub{grid-column:2;text-align:left}.mesgrid .mcell{min-height:60px}.pcrule{grid-template-columns:32px 1fr}.pcrule>*:nth-child(3){grid-column:2}}

.acol .kbm i{background:var(--cc)}

.atask .cbox{width:20px;height:20px;border-radius:6px;margin-top:1px}

.atb{flex:1;min-width:0;display:grid;gap:4px}
.ata{display:flex;gap:4px;align-items:center;justify-content:space-between}

.acsum{background:var(--cc);color:#fff}
.costbox{margin-top:14px;background:var(--shell);border-radius:16px;padding:12px 14px}

.kbfolded span b{color:var(--ink);font-size:15px}
.kbfolded em{margin-left:auto;font-style:normal;font-weight:700;color:var(--ink)}
.kbcolname{flex:1;font-weight:800;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;padding:2px}
/* ---------- responsive ---------- */
@media (max-width:1100px){
  .gcol{grid-column:span 12}

}

}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
