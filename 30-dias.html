<script>
const DAYS=[
{t:"Empezar con intención",mu:"Gymnopédie n.º 1, Erik Satie",mq:"¿Cómo quiero sentirme al terminar estos 30 días? ¿Qué pequeño acto de hoy lo representa? Escribe una acción de menos de 10 minutos.",et:"Presentarme",eq:["What is your name?","Where do you live?","What do you enjoy?"],emT:"Poner nombre",em:"Detente, apoya los pies y completa: «Siento…, lo noto en…, necesito…». Puntúa la intensidad 0–10 y elige una respuesta amable.",iT:"Transportes terrestres",iI:"Carro, autobús y tren llevan personas por tierra.",iJ:"Con tres juguetes grandes o dibujos, haz una carretera y una vía. Muevan cada vehículo nombrándolo.",iP:"¿Cuál va por los rieles?",thT:"Búsqueda visible",th:"Distribuye 5 croquetas de su ración en un suelo limpio y antideslizante, delante de él. Di «busca» una vez y deja que explore.",pT:"Café de inicio",pM:"35 min",p:"Preparen una bebida y respondan por turnos: «¿Qué me gustaría compartir contigo este mes?». Elijan una cita que ambos esperen con ilusión."},
{t:"Una identidad practicable",mu:"Arabesque n.º 1, Claude Debussy",mq:"Completa: «Estoy aprendiendo a ser una persona que…». Añade una conducta observable, no una exigencia de perfección.",et:"Mi rutina",eq:["What do you do in the morning?","What time do you work?","What do you do at night?"],emT:"Volver al presente",em:"Con ojos abiertos, nombra 5 cosas que ves, 4 sensaciones de contacto y 3 sonidos. Termina describiendo dónde estás y qué harás ahora.",iT:"Transportes aéreos",iI:"El avión y el helicóptero vuelan.",iJ:"Mueve dos dibujos por arriba de una carretera de papel. Imiten alas y hélices con los brazos.",iP:"¿Cuál vuela por el cielo?",thT:"Snack de su comida",th:"Ablanda una pequeña porción de su alimento habitual con agua y extiéndela en una alfombrilla de lamido apta para cachorro. Ofrece bajo supervisión.",pT:"Cocinar juntos",pM:"45 min",p:"Elijan una cena sencilla que ya sepan preparar. Repartan tareas, pongan una canción y coman diez minutos sin teléfonos."},
{t:"Mi energía real",mu:"Preludio de la Suite para violonchelo n.º 1, J. S. Bach",mq:"¿Qué me da energía y qué me la quita? Elige una cosa que simplificarás hoy y una que protegerás.",et:"Mi familia",eq:["Who is in your family?","What do your children enjoy?","What do you like doing together?"],emT:"Aflojar el cuerpo",em:"Observa mandíbula, hombros y manos. Suelta tensión al exhalar suavemente, sin aguantar el aire. Después identifica una necesidad corporal.",iT:"Transportes acuáticos",iI:"El barco navega por el agua.",iJ:"Usa un recipiente poco profundo con supervisión continua y un juguete adecuado; compara barco y carro. Vacía al terminar.",iP:"¿Dónde pondrías el barco?",thT:"¿En qué mano?",th:"Muestra una croqueta y ciérrala suavemente en una mano. Abre cuando la huela; repite tres veces. No fomentes mordiscos ni frustración.",pT:"Salir por café",pM:"45–60 min",out:1,p:"Vayan a una cafetería y cuenten una anécdota que el otro no conozca. Alternativa en casa: café servido como una pequeña cita."},
{t:"Atención con propósito",mu:"Clair de lune, Claude Debussy",mq:"¿Qué resultado justificaría mis cuatro horas de trabajo? Define un entregable y la primera acción para comenzarlo.",et:"Mi casa",eq:["Describe your favorite room.","Where do you work at home?","What is next to your desk?"],emT:"Control e influencia",em:"Divide una hoja: «Puedo actuar» y «No depende de mí». Coloca una preocupación en cada lado y actúa solo sobre la primera.",iT:"Vehículos que ayudan",iI:"Ambulancia, camión de bomberos y camión de basura tienen trabajos distintos.",iJ:"Representa rescatar un peluche, apagar un fuego imaginario y recoger papeles grandes.",iP:"¿Cuál ayuda a una persona enferma?",thT:"Pelota al ras",th:"Haz rodar una pelota para perros, demasiado grande para tragar, a un metro. Tres repeticiones sobre suelo antideslizante; sin saltos ni lanzamientos altos.",pT:"Nuestras canciones",pM:"30 min",p:"Cada uno elige tres canciones significativas y explica una historia asociada. Escuchen al menos una completa juntos."},
{t:"Hablarme mejor",mu:"Nocturno op. 9 n.º 2, Frédéric Chopin",mq:"Escribe una frase dura que te dices. ¿Cómo expresarías la misma necesidad a una amiga? Usa esa segunda versión hoy.",et:"Gustos",eq:["What music do you like?","Do you prefer coffee or tea?","What do you dislike?"],emT:"Pensamiento y hecho",em:"Escribe una preocupación. Separa el hecho observable de tu interpretación y completa: «Estoy teniendo el pensamiento de que…». No necesitas discutir con él.",iT:"Semáforo y seguridad",iI:"Rojo: detenerse; verde: avanzar en nuestro juego. En la calle, siempre con un adulto.",iJ:"Haz dos círculos grandes y juega a caminar/parar en casa, sin carreras. Practiquen darse la mano.",iP:"¿Qué hacemos cuando está rojo?",thT:"Toalla abierta",th:"Deja 4 croquetas visibles sobre una toalla extendida; cubre solo una con un pliegue muy fácil. Retira si intenta comer la tela.",pT:"Caminar y conversar",pM:"35 min",out:1,p:"Den un paseo cómodo y respondan: «¿Qué te gustó de esta semana?». Si no pueden salir, conversen junto a una ventana con una bebida."},
{t:"Disfrute intencional",mu:"El cisne, Camille Saint-Saëns",mq:"¿Qué disfruto que no necesita ser productivo? Reserva 15 minutos para eso y escribe cuándo lo harás.",et:"Pedir un café",eq:["Can I have a coffee, please?","What would you like?","How much is it?"],emT:"Pedir apoyo",em:"Ensaya y, si lo necesitas, di: «Estoy sobrecargada. ¿Puedes encargarte de ___ durante ___?». Pide una acción concreta y escucha la respuesta.",iT:"Tierra, aire y agua",iI:"Los transportes se agrupan por dónde se desplazan.",iJ:"Coloca tres hojas: carretera, cielo y mar. Distribuyan juntos seis dibujos, sin exigir que acierte solo.",iP:"¿Dónde viajaría este avión?",thT:"Encuentra tu juguete",th:"Muestra su juguete y colócalo parcialmente visible junto a una silla. Di «busca» y celebra que lo encuentre. Dos o tres turnos.",pT:"Cine",pM:"120 min + traslado",out:1,p:"Elijan una película entre ambos y acuerden cuidado de los niños. Plan en casa: película completa, luces suaves y teléfonos lejos."},
{t:"Primera revisión",mu:"Reverie, Claude Debussy",mq:"¿Qué fue fácil, qué pesó y qué quiero repetir? Conserva un hábito y reduce uno que resultó excesivo.",et:"Repaso personal",eq:["Introduce yourself.","Describe your family.","Tell me about your usual morning."],emT:"Reconocer patrones",em:"Anota un momento de calma y uno de tensión de la semana. ¿Qué ocurrió antes? Elige una señal temprana que observarás la próxima semana.",iT:"Repaso: nuestro viaje",iI:"Elegir transporte y contar una historia sencilla.",iJ:"Deja que elija tres vehículos y un peluche. Inventen un viaje con inicio y llegada. Sigue sus ideas.",iP:"¿Cómo llega el peluche a casa?",thT:"Elección tranquila",th:"Ofrece dos juguetes seguros en el suelo. Acompaña cinco minutos el que elija y termina antes de que se sobreexcite.",pT:"Parque y pausa",pM:"60 min",out:1,p:"Visiten un parque, siéntense y observen el entorno. No conviertan la salida en entrenamiento. Si se quedan en casa, hagan un picnic en el suelo."},
{t:"Mis valores",mu:"Gnossienne n.º 1, Erik Satie",mq:"Elige tres valores: cuidado, creatividad, honestidad, aprendizaje u otros. ¿Qué decisión concreta refleja uno hoy?",et:"Lo que estoy haciendo",eq:["What are you doing now?","What are your children doing?","What are you working on today?"],emT:"Pausa antes de responder",em:"Practica en calma: parar, soltar el aire, notar cuerpo y emoción, elegir qué decir. Ensaya: «Necesito un momento y vuelvo a hablar contigo».",iT:"Mi cuerpo",iI:"Cabeza, manos, pies y barriga son partes del cuerpo.",iJ:"Frente a un espejo, señalen esas partes y después en un muñeco. Terminen con una canción corporal.",iP:"¿Qué parte usamos para caminar?",thT:"Dos estaciones de olor",th:"Pon tres croquetas en cada uno de dos puntos cercanos y visibles. Deja que descubra el segundo a su ritmo, sin arrastrarlo.",pT:"Juego de mesa",pM:"35 min",p:"Jueguen cartas, dominó o un juego que ya tengan. Acuerden que el objetivo es pasarla bien y terminen con una cosa que apreciaron del otro."},
{t:"Hechos de progreso",mu:"Preludio en do mayor, BWV 846, J. S. Bach",mq:"Anota tres esfuerzos recientes, aunque el resultado no haya sido perfecto. ¿Cuál puedes repetir sin agotarte?",et:"Ejercicio",eq:["How often do you exercise?","Do you prefer walking or dancing?","How do you feel after exercise?"],emT:"Validar sin resignarse",em:"Completa: «Tiene sentido que me sienta así porque…; aun así puedo elegir…». Elige una conducta que no dañe a nadie.",iT:"Mis sentidos",iI:"Vemos, oímos y tocamos para conocer el mundo.",iJ:"Muestra un objeto colorido, suena una campana suave y ofrece una tela. Deja que explore sin vendar los ojos.",iP:"¿Esto lo escuchas o lo miras?",thT:"Lamido sencillo",th:"Prepara de nuevo una capa fina de su comida humedecida en su alfombrilla. Cuenta esa porción dentro de la ración diaria.",pT:"Cena a cuatro manos",pM:"45 min",p:"Uno prepara y otro organiza la mesa; cambien la próxima vez. Durante la cena, hablen de un viaje que les gustaría hacer, sin resolver presupuesto hoy."},
{t:"Soltar una expectativa",mu:"Träumerei, op. 15 n.º 7, Robert Schumann",mq:"¿Qué estoy intentando hacer solo por quedar bien? Decide qué puedes renegociar o dejar para otro momento.",et:"La ciudad",eq:["What places are near your home?","Where is the nearest park?","How do you get there?"],emT:"Emoción y necesidad",em:"Elige una emoción de hoy. Pregunta: «¿Necesito descanso, claridad, compañía, espacio o ayuda?». Pide o procura una de esas cosas.",iT:"Colores básicos",iI:"Rojo, azul y amarillo.",iJ:"Busquen tres objetos grandes de esos colores y emparejen cada uno con una hoja pintada.",iP:"¿Dónde está otro objeto azul?",thT:"Encuéntrame cerca",th:"Con otro adulto presente, ponte a la vista detrás de una puerta abierta. Llámalo una vez y prémialo al acercarse. No lo dejes solo si se angustia.",pT:"Café y sueños",pM:"45 min",out:1,p:"Salgan por una bebida y compartan un deseo personal y uno compartido. Alternativa: preparen dos bebidas distintas en casa y hagan la misma conversación."},
{t:"Empezar pequeño",mu:"Gymnopédie n.º 1, Erik Satie",mq:"¿Qué tarea estoy evitando? Divide el comienzo en un paso de cinco minutos y describe exactamente ese paso.",et:"Comprar",eq:["How much does this cost?","Do you have another color?","Can I pay by card?"],emT:"Decir no con claridad",em:"Ensaya: «Hoy no puedo hacer X. Sí puedo Y el día Z». Mantén la frase corta; no necesitas inventar excusas.",iT:"Formas",iI:"Círculo y cuadrado tienen formas diferentes.",iJ:"Dibuja formas grandes y busca un plato y una caja para compararlas. Repasen bordes con el dedo.",iP:"¿Cuál es redondo?",thT:"Pelota y pausa",th:"Rueda la pelota grande una vez, haz una pausa tranquila y repite hasta tres veces. Intercambia por una croqueta si necesitas recuperarla.",pT:"Recuerdos buenos",pM:"30 min",p:"Elijan cinco fotos de momentos agradables. Cada uno cuenta qué recuerda; eviten convertirlo en comparación con el presente."},
{t:"Maternidad suficiente",mu:"Arabesque n.º 1, Claude Debussy",mq:"¿Qué necesitan hoy mis hijos de mí de forma realista? ¿Qué expectativa puedo soltar para estar más presente?",et:"Emociones",eq:["How are you feeling today?","What helps you feel calm?","What do you need right now?"],emT:"Autocompasión",em:"Escribe: «Esto es difícil. No tengo que resolver todo ahora. El siguiente paso amable es…». Haz ese paso o agenda ayuda.",iT:"Grande y pequeño",iI:"Podemos comparar tamaños.",iJ:"Ordenen dos pares de peluches o recipientes grandes/pequeños. Cambia de pareja para repetir la idea.",iP:"¿Cuál es más grande de estos dos?",thT:"Un recipiente",th:"Pon una croqueta en un recipiente ancho y bajo. Deja que la encuentre; después colócalo a un paso de distancia. Usa material irrompible.",pT:"Paseo con curiosidad",pM:"40 min",out:1,p:"Caminen por una ruta conocida y busquen tres detalles que nunca habían notado. En casa, dibujen un lugar que quieran visitar juntos."},
{t:"Curiosidad",mu:"Preludio de la Suite para violonchelo n.º 1, J. S. Bach",mq:"¿Qué me gustaría conocer por placer? Escribe una pregunta y dedica cinco minutos del día a explorarla.",et:"Mi cachorro",eq:["What is your puppy called?","What games does he like?","How do you take care of him?"],emT:"Reparar",em:"Piensa en un desencuentro pequeño. Ensaya: «Hice/dije X, entiendo que pudo doler. Lo siento. La próxima vez haré Y». Evita justificarte con un «pero».",iT:"Contar hasta tres",iI:"Un número por cada objeto, sin apurarse.",iJ:"Entrega tres bloques grandes a un peluche, tocando cada uno al contar. Retira uno y vuelve a contar.",iP:"¿Le damos dos bloques?",thT:"Sendero corto",th:"Traza un sendero visible de 5 croquetas separadas unos 20 cm en casa. Al final deja su juguete favorito.",pT:"Picnic de pareja",pM:"60–75 min",out:1,p:"Lleven una comida sencilla a un lugar tranquilo y conversen sin prisa. Si no hay cuidador, hagan el picnic en casa después de acostar a los niños."},
{t:"Revisar sin castigar",mu:"Clair de lune, Claude Debussy",mq:"¿Qué dos cosas están funcionando? ¿Qué ajuste de tiempo haría la próxima semana más amable? Elige solo uno.",et:"Repaso: día cotidiano",eq:["Describe your day.","Ask me for directions.","Tell me how you feel and why."],emT:"Registrar lo agradable",em:"Recuerda una experiencia agradable y describe tres detalles sensoriales. Nota cómo te sientes sin exigirte cambiar una emoción difícil.",iT:"Repaso de descubrimientos",iI:"Revisar colores, tamaños y cantidades jugando.",iJ:"Arma una tienda con seis objetos grandes. Pide «dos azules» o «el grande» y deja que también te pida a ti.",iP:"¿Qué quieres comprarme?",thT:"Juego elegido",th:"Repite el juego que más disfrutó, en su versión más fácil. Observa si se aparta, bosteza o pierde interés y déjalo descansar.",pT:"Brunch en casa",pM:"60 min",p:"Preparen un desayuno tardío o merienda especial. Cada uno dice qué momento del mes quiere repetir y propone una actividad sencilla."},
{t:"Mi cuerpo como aliado",mu:"Nocturno op. 9 n.º 2, Frédéric Chopin",mq:"¿Qué me ha permitido hacer mi cuerpo esta semana? ¿Qué señal de descanso o cuidado necesito atender?",et:"Ayer",eq:["What did you do yesterday?","What did you enjoy?","What was difficult?"],emT:"Dar espacio",em:"Durante dos minutos observa una emoción como una sensación cambiante. Describe presión, calor o tensión sin intentar eliminarla; luego vuelve a una tarea sencilla.",iT:"Animales de casa y granja",iI:"Perro, gato, vaca y gallina son animales distintos.",iJ:"Con imágenes, imiten sonidos y cuenten dónde vive cada uno. Con Thomas solo observen si está tranquilo.",iP:"¿Cuál hace muuu?",thT:"Tres puntos visibles",th:"Distribuye parte de su ración en tres lugares muy cercanos, sin esconder en muebles ni alturas. Deja que marque el ritmo.",pT:"Preguntas nuevas",pM:"30 min",p:"Respondan: «¿Qué te gustaría aprender?», «¿Qué te hace sentir cuidado?» y «¿Qué plan pequeño te entusiasma?». No interrumpan las respuestas."},
{t:"Confianza basada en acciones",mu:"El cisne, Camille Saint-Saëns",mq:"Recuerda una situación difícil que resolviste. ¿Qué habilidad utilizaste y dónde puedes usarla hoy?",et:"Un recuerdo",eq:["Where did you go on a memorable trip?","Who went with you?","What happened?"],emT:"Salir de la comparación",em:"Nombra con quién te comparaste y qué necesidad apareció. Cierra la fuente de comparación y elige una acción acorde con tu propia situación.",iT:"Animales silvestres",iI:"León, elefante y jirafa no son mascotas.",iJ:"Caminen como esos animales e identifiquen trompa, cuello y melena en imágenes.",iP:"¿Quién tiene una trompa larga?",thT:"Preparar su snack",th:"Humedece alimento habitual y rellena solo la entrada de un juguete dispensador adecuado a su tamaño. Hazlo fácil y úsalo supervisado.",pT:"Cocinar algo distinto",pM:"45 min",p:"Elijan una receta sencilla nueva y repartan pasos antes de empezar. Acepten un resultado imperfecto y disfruten probarla juntos."},
{t:"Límites que cuidan",mu:"Reverie, Claude Debussy",mq:"Completa: «Hoy puedo ofrecer…; hoy no puedo asumir…». Define una alternativa concreta cuando sea posible.",et:"Planes",eq:["What are you going to do this weekend?","Who will join you?","What do you need to prepare?"],emT:"Enojo seguro",em:"Reconoce tu primera señal de enojo. Ensaya pedir una pausa, tomar distancia con los niños seguros y volver a una hora acordada. No sigas discutiendo activada.",iT:"Dónde viven los animales",iI:"Los animales necesitan un lugar adecuado para vivir.",iJ:"Dibuja agua, bosque y granja; coloquen pez, búho y vaca. Aclara que es un juego simplificado.",iP:"¿Dónde pondrías al pez?",thT:"Olor del juguete",th:"Deja que huela su juguete, colócalo entre dos objetos grandes seguros y pídele buscar. Mantén todo visible al principio.",pT:"Paseo al atardecer",pM:"35–45 min",out:1,p:"Caminen a ritmo cómodo. Cada uno cuenta una preocupación y aclara si quiere escucha o ideas. En casa, hagan lo mismo sentados en un lugar tranquilo."},
{t:"Enfoque profesional",mu:"Gnossienne n.º 1, Erik Satie",mq:"¿Qué actividad mueve más mi trabajo hacia adelante? ¿Qué tarea secundaria puedo agrupar o posponer?",et:"Mi trabajo",eq:["What do you do?","Who do you help?","What problem do you help them solve?"],emT:"Elegir un anclaje",em:"Prueba tres apoyos: pies firmes, mirar un objeto y escuchar sonidos cercanos. Quédate con el más cómodo y úsalo un minuto.",iT:"Las plantas",iI:"Muchas plantas tienen raíz, tallo y hojas; necesitan cuidados.",iJ:"Miren una planta segura. Señala tallo y hojas, y rieguen juntos si corresponde. Dibuja la raíz debajo de la tierra.",iP:"¿Dónde están sus hojas?",thT:"Pelota con intercambio",th:"Rueda la pelota a un metro. Cuando se acerque, ofrece otra igual o una croqueta y recoge la primera sin forcejear. Tres turnos.",pT:"Bailar juntos",pM:"30 min",p:"Elijan cuatro canciones: dos de cada uno. Bailen sin ensayar y terminen sentados, con agua, hablando de lo que les hizo reír."},
{t:"Descanso con permiso",mu:"Preludio en do mayor, BWV 846, J. S. Bach",mq:"¿Qué temo que ocurra si descanso 15 minutos? ¿Qué evidencia tengo? Reserva un descanso sin pantalla.",et:"Una reunión",eq:["What is the goal of this meeting?","Could you explain that again?","What is the next step?"],emT:"Acompañar la tristeza",em:"Completa: «Hoy me duele… y me ayudaría…». Permítete sentir sin apresurar una solución. Elige compañía, descanso o una acción pequeña.",iT:"El tiempo",iI:"Podemos observar sol, nubes, lluvia y viento.",iJ:"Miren por la ventana y dibujen el tiempo de hoy. Mueve una cinta con la mano para representar viento.",iP:"¿Qué ves hoy en el cielo?",thT:"Pliegue fácil",th:"Pon tres croquetas sobre una toalla y una bajo un pliegue abierto. Si no la encuentra, levanta la tela. Retírala al terminar.",pT:"Merienda fuera",pM:"45–60 min",out:1,p:"Compartan una merienda en un lugar conocido. Cada uno hace una pregunta abierta al otro. Alternativa: merienda distinta en la mesa de casa."},
{t:"Cuidar el vínculo",mu:"Träumerei, op. 15 n.º 7, Robert Schumann",mq:"¿Qué gesto de mi pareja valoro? ¿Qué gesto concreto puedo ofrecer sin esperar una respuesta idéntica?",et:"En el restaurante",eq:["Could we have a table for two?","What do you recommend?","Could we have the bill, please?"],emT:"Escucha emocional",em:"Con tu pareja, habla dos minutos de cómo estás. La otra persona resume sin aconsejar y pregunta: «¿Quieres escucha o ayuda?». Intercambien papeles.",iT:"La Tierra",iI:"Vivimos en un planeta llamado Tierra.",iJ:"Muestra una imagen de la Tierra y una pelota grande. Señala agua y tierra; dibujen su casa dentro de un círculo.",iP:"¿Cómo se llama nuestro planeta?",thT:"Búsqueda en pareja",th:"Dos adultos dejan croquetas, por turnos, en puntos cercanos del suelo. Un adulto juega y el otro supervisa; sin niños alrededor de la comida.",pT:"Segunda cita de cine",pM:"120 min + traslado",out:1,p:"Esta vez elige quien no eligió la primera película. Después, comenten su personaje favorito. Si no salen, usen el mismo ritual en casa."},
{t:"Celebrar el proceso",mu:"Gymnopédie n.º 1, Erik Satie",mq:"¿Qué hago ahora con más facilidad que el día 1? Elige una forma sencilla de celebrarlo hoy.",et:"Repaso: pasado y futuro",eq:["Tell me about yesterday.","Describe your work.","Explain your plans for next week."],emT:"Corregulación",em:"Ensaya con un peluche: «Veo que estás molesto. Estoy aquí. No dejaré que pegues». Ofrece cercanía sin forzar abrazo; practícalo con los niños solo cuando corresponda.",iT:"Sol, Luna y día/noche",iI:"El Sol es una estrella; la Luna acompaña a la Tierra y a veces se ve de día.",iJ:"Con una linterna y pelota, ilumina un lado y gira despacio. Nunca dirijas la luz a sus ojos ni miren el Sol.",iP:"¿Qué lado de la pelota está iluminado?",thT:"Oler a su ritmo",th:"Deja una prenda limpia del hogar extendida para que la huela, sin perfumes añadidos. Retírala si la muerde y ofrece su juguete.",pT:"Parque sin agenda",pM:"60 min",out:1,p:"Visiten un parque y alternen paseo suave y descanso. Dejen libre parte del tiempo. En casa: picnic y mirar el cielo desde una ventana segura."},
{t:"Claridad",mu:"Arabesque n.º 1, Claude Debussy",mq:"¿Qué quiero mantener este mes y qué no quiero seguir repitiendo? Escribe una decisión pequeña para cada respuesta.",et:"Expresar opiniones",eq:["What do you think about working from home?","Why?","What is one advantage and one challenge?"],emT:"Tolerar una espera",em:"Elige una espera pequeña y segura, como antes de mirar el móvil. Observa la incomodidad un minuto y decide conscientemente si quieres continuar.",iT:"Mercurio y Venus",iI:"Son los dos planetas más cercanos al Sol.",iJ:"Coloca un círculo amarillo como Sol y dos tarjetas grandes delante, nombrándolas sin exigir memoria.",iP:"¿Cuál tarjeta pondremos cerca del Sol?",thT:"Dos recipientes abiertos",th:"Coloca una croqueta en uno de dos recipientes bajos y separados. Deja que huela ambos y encuentre; no hace falta taparlos.",pT:"Crear juntos",pM:"40 min",p:"Dibujen, pinten o hagan un collage con lo que tengan. Tema: «Un día que nos gustaría vivir». No comparen quién lo hizo mejor."},
{t:"Aprender del tropiezo",mu:"Preludio de la Suite para violonchelo n.º 1, J. S. Bach",mq:"Elige un día que no salió como querías. Describe el obstáculo sin juzgarte y diseña un plan B realista.",et:"Comparar opciones",eq:["Do you prefer a café or a park for a date?","Which is more relaxing?","What would you choose today?"],emT:"Revisar la culpa",em:"Pregunta: «¿Hice daño y debo reparar, o no cumplí una expectativa imposible?». Define reparación concreta o una expectativa más justa.",iT:"Tierra y Marte",iI:"La Tierra es nuestro hogar; Marte suele verse rojizo.",iJ:"Usa una imagen de cada planeta y colores azul, verde y rojo para decorarlos libremente.",iP:"¿En cuál vivimos nosotros?",thT:"Lamido y calma",th:"Ofrece una pequeña porción de su comida habitual ablandada en la alfombrilla. Al terminar, limpia el material y facilita descanso.",pT:"Cena de recuerdos",pM:"45 min",p:"Cocinen algo que les recuerde una ocasión agradable y cuenten esa historia. Si no recuerdan una receta, inventen hoy una nueva tradición."},
{t:"Crear espacio",mu:"Clair de lune, Claude Debussy",mq:"¿Qué pendiente ocupa mi cabeza? Decide: hacer, agendar, delegar o descartar. Resuelve solo su siguiente paso.",et:"Explicar un servicio",eq:["What service do you offer?","Who is it for?","What is included?"],emT:"Petición asertiva",em:"Escribe: «Cuando ocurre X, me siento Y y necesito Z. ¿Podemos hacer A?». Usa una situación observable y evita «siempre» o «nunca».",iT:"Júpiter",iI:"Es el planeta más grande del sistema solar.",iJ:"Compara un círculo de papel muy grande con otros más pequeños. Dibuja bandas sobre el grande.",iP:"¿Cuál es el más grande de estos dibujos?",thT:"Juguete a un lado",th:"Muestra su juguete y déjalo parcialmente visible a la derecha o izquierda de una caja abierta, sin grapas. Dos búsquedas fáciles.",pT:"Café sin logística",pM:"45 min",out:1,p:"En una cafetería o en casa, acuerden dejar pendientes domésticos para otro momento. Hablen de intereses, ideas y experiencias personales."},
{t:"Conexión auténtica",mu:"Nocturno op. 9 n.º 2, Frédéric Chopin",mq:"¿Con quién quiero sentirme más conectada? Elige una conversación y una pregunta abierta para esa persona.",et:"Conversar con un cliente",eq:["What is your main goal?","Who is your audience?","What is your timeline?"],emT:"Detectar el impulso",em:"Antes de abrir redes, pregunta: «¿Busco información, descanso o evitar algo?». Elige una respuesta de dos minutos que atienda esa necesidad.",iT:"Saturno",iI:"Es conocido por sus anillos.",iJ:"Dibuja un planeta grande y pega una banda ancha de papel alrededor con ayuda adulta.",iP:"¿Qué tiene alrededor Saturno?",thT:"Pelota lenta",th:"Rueda la pelota lentamente sobre una alfombra. Haz tres turnos; termina con caricias solo si él se acerca a pedirlas.",pT:"Ruta compartida",pM:"40 min",out:1,p:"Cada uno elige una parte de un paseo corto por una zona conocida. En casa, diseñen sobre papel una ruta futura con tres paradas."},
{t:"Disfrutar lo cotidiano",mu:"El cisne, Camille Saint-Saëns",mq:"Describe tres detalles agradables de ayer. ¿Cómo puedes prestar atención a uno parecido hoy sin forzarlo?",et:"Resolver un problema",eq:["What happened?","What can we do now?","Which solution do you suggest?"],emT:"Sacar pendientes de la cabeza",em:"Anota preocupaciones. Marca una con acción posible y agenda su siguiente paso. Si vuelve otra, recuérdate dónde quedó escrita y vuelve al presente.",iT:"Urano y Neptuno",iI:"Son planetas muy lejanos al Sol; Neptuno es el más lejano de los ocho.",iJ:"Pon dos tarjetas azuladas al final de una fila. Explora «cerca» y «lejos» sin pedir distancias.",iP:"¿Cuál pusimos más lejos del Sol?",thT:"Olfato en una zona",th:"Esparce seis croquetas en una zona pequeña del suelo. Déjalo buscar sin señalar constantemente ni moverlo de lugar.",pT:"Mini cita sorpresa",pM:"40 min",p:"Uno organiza bebida, música y una actividad sencilla; el otro solo participa. Acuerden presupuesto mínimo y eviten regalos como requisito."},
{t:"Mi voz",mu:"Reverie, Claude Debussy",mq:"¿Qué necesidad no he expresado con claridad? Escríbela en una frase breve y respetuosa.",et:"Contar una historia",eq:["Tell a story with a beginning, a problem and an ending.","How did you feel?","What did you learn?"],emT:"Elegir desde valores",em:"Ante una decisión pequeña, pregunta: «¿Qué respuesta se parece al tipo de persona que quiero ser?». Hazla aunque la emoción no desaparezca.",iT:"Los ocho planetas",iI:"Hay ocho planetas en nuestro sistema solar.",iJ:"Ordena tú las tarjetas: Mercurio, Venus, Tierra, Marte, Júpiter, Saturno, Urano y Neptuno. Él puede elegir su favorito.",iP:"¿Cuál te gustaría volver a pintar?",thT:"Busca y descansa",th:"Una búsqueda fácil de juguete, una croqueta encontrada y acceso a su cama. La sesión termina aunque todavía tengas tiempo disponible.",pT:"Plan cultural",pM:"60–90 min",out:1,p:"Visiten una librería, exposición o actividad local que ambos elijan, comprobando horario. En casa: documental corto y conversación sobre lo aprendido."},
{t:"Revisión de carga",mu:"Gnossienne n.º 1, Erik Satie",mq:"¿Qué hábito me ayuda de verdad y cuál se convirtió en presión? Conserva, adapta o retira uno con intención.",et:"Repaso libre",eq:["Talk about your family, work and goals.","Ask me three follow-up questions.","Summarize our conversation."],emT:"Mi red de apoyo",em:"Escribe dos personas o recursos a los que puedes acudir y para qué. Formula una petición breve y realista para cuando la necesites.",iT:"Astronautas y cohetes",iI:"Los astronautas viajan al espacio; un cohete puede llevarlos.",iJ:"Decoren una caja abierta como nave y hagan una cuenta atrás de tres. Mantén salidas libres y no uses bolsas o cascos cerrados.",iP:"¿Qué llevarías en nuestro viaje imaginario?",thT:"Favorito del mes",th:"Elige entre búsqueda visible, lamido o pelota lenta según lo que él haya disfrutado. Mantén la dificultad baja y respeta si prefiere dormir.",pT:"Desayuno y acuerdos",pM:"60 min",p:"Preparen una comida juntos y revisen qué citas disfrutaron más. Escojan dos para repetir el próximo mes, sin evaluar al otro."},

}

/* ---------- MOVIMIENTO ---------- */
/* movimiento: detalle por día (minutos, distancia, calorías) */
let movWeek=0;
const MET={w:3.5,r:7,y:2.5,p:3,s:3.5,d:5,m:3,x:1.3};
function movDay(n,kg){
  const w=wdOf(n), st=stageOf(n), ex=exercise(n);
  let segs,title,sub,cls,timer,km=0;
  if(ex.kind==="cardio"){const c=ex.c, walk=5+c.r*c.offS/60+5, jog=c.r*c.onS/60, yo=ex.second[1]==="p1";
    title="Caminata/trote"; sub="+ "+ex.second[0]+(yo?" (pilates suave)":" (yoga suave)"); cls="c-lav"; timer="cardio";
    segs=[["Calentar caminando",5,"w","w"],["Intervalos",c.r*(c.onS+c.offS)/60,"r","r",c.r+" × ("+c.on+" trote + "+c.off+" caminar)"],["Enfriar caminando",5,"w","w"],[ex.second[0],10,yo?"p":"y","y",yo?"Pilates suave":"Yoga suave"]];
    km=walk*5/60+jog*7.5/60;
    const kc=(5*MET.w+c.r*c.offS/60*MET.w+c.r*c.onS/60*MET.r+5*MET.w+10*(yo?MET.p:MET.y))*kg/60;
    return {title,sub,cls,timer,segs,km:Math.round(km*10)/10,min:segs.reduce((a,s)=>a+s[1],0),kcal:Math.round(kc)};}
  if(ex.kind==="weights"){const pm=st===1?12:20, dm=danceMin(n), bl=blocksDance(n);
    title="Pesas "+ex.L; sub="+ "+ex.dance[0].toUpperCase()+ex.dance.slice(1); cls=ex.L==="C"?"c-yel":"c-pink"; timer="weights";
    segs=[["Calentamiento",6,"m","w","Marcha y movilidad"],["Pesas "+ex.L,pm,"s","s",setsOf(n)+" · 6 ejercicios"],["Pausa e hidratación",2,"x","p"],["Baile: "+ex.dance,dm,"d","d",bl.map(b=>b[0].replace("Baile: ","")+" "+b[1]/60+"′").join(" · ")],["Marcha suave",4,"m","w"]];
    const kc=segs.reduce((a,s)=>a+s[1]*MET[s[2]],0)*kg/60;
    return {title,sub,cls,timer,segs,km:0,min:segs.reduce((a,s)=>a+s[1],0),kcal:Math.round(kc)};}
  segs=[["Paseo recreativo (opcional)",15,"w","w","10–20 min, sin objetivo"]];
  return {title:"Recuperación",sub:"Sin pesas, trote ni baile",cls:"hatch",timer:"",segs,km:Math.round(15*5/60*10)/10,min:15,kcal:Math.round(15*MET.w*kg/60)};
}
/* diagrama semanal: actividades (filas) × días lunes–domingo (columnas) */
function weekGantt(mw,d,kg){
  const dayN=i=>(mw-1)*7+i+1, c=CARDIO[mw], cw=d>=dayN(0)&&d<=dayN(6)?d-dayN(0):-1;
  const pm=mw===1?12:20, dm=danceMin(dayN(1)), sets=setsOf(dayN(1)).replace(/ series? × /,"×"), iv=c.r+"×("+c.on.replace(" min","′").replace(" s","″")+"+"+c.off.replace(" min","′").replace(" s","″")+")";
  const ROWS=[
   ["A","Caminata/trote","#3B6EE8",{0:[iv,c.base-10],2:[iv,c.base-10],4:[iv,c.base-10]}],
   ["B","Pesas","#D9467F",{1:["A · "+sets,pm+8],3:["B · "+sets,pm+8],5:["C · "+sets,pm+8]}],
   ["C","Bailoterapia","#C77A0A",{1:["Merengue",dm+4],3:["Salsa",dm+4],5:["Mezcla latina",dm+4]}],
   ["D","Yoga / pilates","#8B5CF6",{0:["Yoga Y1",10],2:["Pilates P1",10],4:["Yoga Y2",10]}],
   ["E","Recuperación","#1F9D55",{6:["Paseo opcional",15]}]];
  const MD=Array.from({length:7},(_,i)=>movDay(dayN(i),kg));
  return `<div class="wg"><div class="wg-in">

   ${ROWS.map(([L,name,col,cells])=>{const tot=Object.values(cells).reduce((a,x)=>a+x[1],0);return `<div class="wg-row"><div class="who"><b style="background:${col}">${L}</b><span>${name}<br><span class="mini" style="text-transform:none;letter-spacing:0;font-weight:600">${tot} min/semana</span></span></div>

let niTab="apr", careYM=null;
const CARE_K=[["ei","Ignacio · Escuelita","#D9812E","",""],["et","Escuelita tarde","#B8741A","et","+"],["fm","Lucas · Fátima mañana","#2F6FD1","fm",""],["ft","Fátima tarde","#6A5AE0","ft","+"],["fb","Fátima cuida a ambos","#D9467F","fb","+"]];
function care(){ const c=state.care||(state.care={}); c.rates=Object.assign({fm:3,ft:3,fb:5,et:5,em:70},c.rates||{}); c.days=c.days||{}; c.nofee=c.nofee||{}; return c; }
function careMonth(){ if(!careYM){const n=new Date();careYM=[n.getFullYear(),n.getMonth()];} return careYM; }
function careSum(ym){
  const C=care(), R=C.rates, days=Object.entries(C.days).filter(([k])=>k.startsWith(ym));
  const cnt=k=>days.filter(([,v])=>v[k]).length;
  const fee=C.nofee[ym]?0:+R.em||0, esc2=cnt("et")*(+R.et||0), fat=cnt("fm")*(+R.fm||0)+cnt("ft")*(+R.ft||0)+cnt("fb")*(+R.fb||0);
  return {fee,esc2,fat,total:fee+esc2+fat,cnt,days:days.filter(([,v])=>Object.values(v).some(Boolean)).length};
}
function syncCare(ym){
  const F=fin(), s=careSum(ym), id="care-"+ym, [y,m]=ym.split("-").map(Number), last=new Date(y,m,0).getDate();
  let cat=F.cats.find(c=>c.id==="cuidado"); if(!cat){cat={id:"cuidado",name:"Cuidado de niños",color:"#D9467F",op:"gasto"};F.cats.push(cat);}
  F.tx=F.tx.filter(t=>t.id!==id);
  if(s.total>0) F.tx.push({id,date:ym+"-"+pad2(last),cat:"cuidado",op:"gasto",amt:Math.round(s.total*100)/100,note:`Automático desde Niños → Cuidado (${s.days} días)`,auto:1});
}

  const d=state.day;
  const pills=`<div class="subtabs" role="tablist"><button role="tab" data-nitab="apr" aria-selected="${niTab==="apr"}">${ico("star")}Aprendizaje</button><button role="tab" data-nitab="care" aria-selected="${niTab==="care"}">${ico("ok")}Cuidado</button></div>`;
  if(niTab==="care"){ renderCare(pills); return; }
  const g=IGN[d-1], W=ignWeek(d);
  $("#v-ign").innerHTML=`${stickBar("Aprendizaje",Math.round(doneOf("ign")/30*100),`semana: ${W.t}`)}<h2 class="h2">Niños</h2>${pills}

const MIND_LV=[[0,"Semilla"],[7,"Brote"],[14,"Flor"],[21,"Árbol"],[30,"Bosque"]];
function mindStats(){
  const on=n=>isOn(n,"mind"), done=DAYS.filter((_,i)=>on(i+1)).length;
  let streak=0; for(let n=state.day;n>=1;n--){ if(on(n)) streak++; else if(n===state.day) continue; else break; }
  let best=0,run=0; for(let n=1;n<=30;n++){ run=on(n)?run+1:0; best=Math.max(best,run); }
  let li=0; MIND_LV.forEach(([m],i)=>{ if(done>=m) li=i; });
  const next=MIND_LV[li+1];
  return {done,streak,best,xp:done*10,lv:MIND_LV[li][1],li,next,toNext:next?next[0]-done:0,
    badges:[["Primer paso","Completa 1 misión",done>=1],["Racha de 3","3 días seguidos",best>=3],["Semana perfecta","Días 1–7 completos",[1,2,3,4,5,6,7].every(on)],["Mitad del camino","15 misiones",done>=15],["Racha de 7","7 días seguidos",best>=7],["30 de 30","Todas las misiones",done>=30]]};
}

function kbFind(key){const [cid,tid]=key.split("|");const co=work().cos.find(c=>c.id===cid);return {co,t:co&&co.tasks.find(t=>t.id===tid)};}
function kbAction(a,b){
  const W=work(), id=b&&b.dataset.id;

  else if(a==="foldall"||a==="openall"){W.cos.forEach(c=>c.fold=a==="foldall");}

  else if(a==="delcol"){const has=W.cos.some(c=>c.tasks.some(t=>t.col===id)); if(!b.dataset.armed){b.dataset.armed="1";b.textContent=has?"¿Borrar con tareas?":"¿Borrar?";b.style.width="auto";b.style.padding="0 8px";b.style.borderRadius="999px";return;}
    const i=W.cols.findIndex(c=>c.id===id), to=W.cols[i===0?1:i-1]; W.cos.forEach(c=>c.tasks.forEach(t=>{if(t.col===id&&to) t.col=to.id;})); W.cols.splice(i,1);}
  else if(a==="delco"){ if(!b.dataset.armed){b.dataset.armed="1";b.textContent="¿Borrar empresa?";b.style.width="auto";b.style.padding="0 8px";b.style.borderRadius="999px";return;} W.cos=W.cos.filter(c=>c.id!==id);}
  else if(a==="up"||a==="down"){const i=W.cos.findIndex(c=>c.id===id), j=a==="up"?i-1:i+1; if(j<0||j>=W.cos.length) return; [W.cos[i],W.cos[j]]=[W.cos[j],W.cos[i]];}
  else if(a==="addtask"){const [cid,col]=id.split("|"); const co=W.cos.find(c=>c.id===cid); const t={id:uid(),t:"",col}; co.tasks.push(t); save(); renderAll(true);
    const el=document.querySelector(`[data-kbt="${cid}|${t.id}"]`); if(el) el.focus(); return;}
  else if(a==="left"||a==="right"){const {t}=kbFind(id); const i=W.cols.findIndex(c=>c.id===t.col), j=a==="left"?i-1:i+1; if(W.cols[j]) t.col=W.cols[j].id;}
  else if(a==="deltask"){const {co,t}=kbFind(id); co.tasks=co.tasks.filter(x=>x!==t);}

}

function finAction(a,b){
  const f=fin();
  if(a==="prev"||a==="next"){const [y,m]=finMonth();const d=new Date(y,m+(a==="next"?1:-1),1);finYM=[d.getFullYear(),d.getMonth()];finSel=isoOf(d);}
  else if(a==="today"){finYM=null;finSel=isoOf(new Date());}
  else if(a==="add"){
    const amt=parseFloat(($("#fAmt").value||"").replace(/\s/g,"").replace(",","."));
    const cat=(document.querySelector('input[name="fcat"]:checked')||{}).value;
    if(!(amt>0)){$("#fAmt").focus();$("#fAmt").style.borderColor="var(--bad)";return;}
    finLastCat=cat; f.tx.push({id:uid(),date:finSel,cat,op:$("#fOp").value,amt:Math.round(amt*100)/100,note:$("#fNote").value.trim()});
  }
  else if(a==="del"){f.tx=f.tx.filter(t=>t.id!==b.dataset.id);}
  else if(a==="cats"){catOpen=true;renderCatDlg();const d=$("#catDlg");if(!d.open) d.showModal();return;}
  else if(a==="quicktog"){finQuick=!finQuick; renderAll(true); if(finQuick&&$("#qcName")) $("#qcName").focus(); return;}
  else if(a==="quickadd"){const name=$("#qcName").value.trim(); if(!name){$("#qcName").focus();return;}
    const pick=document.querySelector('input[name="qcColor"]:checked'), id=uid();
    f.cats.push({id,name,op:$("#qcOp").value,color:pick?pick.value:$("#qcCustom").value}); finLastCat=id; finQuick=false;}
  else if(a==="catclose"){catOpen=false;$("#catDlg").close();return;}
  else if(a==="catadd"){
    const name=$("#ncName").value.trim(); if(!name){$("#ncName").focus();return;}
    const pick=document.querySelector('input[name="ncColor"]:checked');
    f.cats.push({id:uid(),name,op:$("#ncOp").value,color:pick?pick.value:$("#ncCustom").value});
  }
  else if(a==="catdel"){const n=f.tx.filter(t=>t.cat===b.dataset.id).length;
    if(!b.dataset.armed){ b.dataset.armed="1"; b.textContent=n?`¿Borrar? ${n} mov.`:"¿Borrar?"; b.style.width="auto"; b.style.padding="0 8px"; b.style.borderRadius="999px"; return; }
    f.cats=f.cats.filter(c=>c.id!==b.dataset.id);}
  save(); renderAll(true);
}

const LOG_PROMPT=`Estas imágenes son capturas de un resumen de entrenamiento de la app Fitness/Salud del iPhone o de un Apple Watch (pueden estar en español o inglés). Extrae los datos del entrenamiento y responde SOLO con un objeto JSON con estas claves:
{"type": texto corto en español (p. ej. "Caminata al aire libre", "Carrera", "Fuerza tradicional", "Baile", "Yoga", "Pilates"),
 "date": "YYYY-MM-DD" o null,
 "start_time": "HH:MM" o null,
 "duration_min": número de minutos (convierte 0:42:15 a 42.25) o null,
 "distance_km": número en km (convierte millas a km multiplicando por 1.609) o null,
 "active_kcal": calorías activas (ACTIVE KILOCALORIES / Calorías activas) o null,
 "total_kcal": calorías totales o null,
 "avg_hr": frecuencia cardiaca media en ppm o null,
 "max_hr": frecuencia máxima o null,
 "steps": pasos o null,
 "pace": ritmo medio como texto (p. ej. "9'45\\" /km") o null,
 "elevation_m": desnivel positivo en metros o null,

async function readLogPhotos(files){
  logFiles=files; logDraft={day:state.day,date:"",type:"",min:"",km:"",kcal:"",kcalTot:"",hr:"",hrMax:"",steps:"",pace:"",note:""};
  if(!sampleFn||!sampleImg){ logMsg="La lectura automática funciona en la versión publicada en Claude. Completa los datos a mano."; renderAll(true); return; }
  logBusy=true; logMsg="Leyendo la captura… puede tardar unos segundos."; renderAll(true);
  try{
    const r=await sampleFn.json(LOG_PROMPT,{images:Array.from(files).slice(0,4)});
    const v=(x)=>x==null||x===""?"":x;
    Object.assign(logDraft,{date:v(r.date),type:v(r.type),min:v(r.duration_min),km:v(r.distance_km),kcal:v(r.active_kcal),kcalTot:v(r.total_kcal),hr:v(r.avg_hr),hrMax:v(r.max_hr),steps:v(r.steps),pace:v(r.pace),note:v(r.notes)});
    const dd=dayFromDate(logDraft.date); if(dd) logDraft.day=dd;
    logMsg="Listo. Revisa los datos y guarda.";
  }catch(e){
    logMsg=e&&e.code==="not_granted"?"No se dio permiso para leer la imagen. Completa los datos a mano.":e&&e.code==="rate_limited"?"Demasiadas lecturas seguidas. Espera un momento o completa a mano.":"No pude leer la captura. Completa los datos a mano.";
  }
  logBusy=false; renderAll(true);
}
async function saveLog(){

  if(!e.min&&!e.kcal&&!e.km){ logMsg="Anota al menos minutos, distancia o calorías."; renderAll(true); return; }

  logOf().push(e); state.checks[e.day+":move"]=1;

  save(); renderAll(true);
}

function fwAction(a,b){

  else if(a==="today"){fwYM=null;fwSel=isoOf(new Date());fwDraft=null;fwWarn=false;}

  if(ds.czit){const [k,id]=ds.czit.split("|"), it=casa(k).items.find(x=>x.id===id); if(!it) return; const f=ds.f; if(f==="amt"){const v=parseFloat(t.value.replace(",","."));it.amt=isNaN(v)?0:v;} else if(f==="name") it.name=t.value.trim()||it.name; else it[f]=t.value; save(); renderAll(true); return;}
  if(ds.czarea){const [k,id]=ds.czarea.split("|"), ar=casa(k).areas.find(x=>x.id===id); if(ar){ar.name=t.value.trim()||ar.name; save(); renderAll(true);} return;}
  if(ds.cztk){const [k,id]=ds.cztk.split("|"), tk=casa(k).tasks.find(x=>x.id===id); if(!tk) return; if(ds.f==="cost"){const v=parseFloat(t.value.replace(/[^0-9.,]/g,"").replace(",","."));tk.cost=isNaN(v)?0:v;} else tk[ds.f]=ds.f==="t"?(t.value.trim()||tk.t):t.value; save(); renderAll(true); return;}
  if(ds.pcr){const r=pcare().rules.find(x=>x.id===ds.pcr); if(!r) return; if(ds.f==="days"){const d=parseDays(t.value); if(d.length) r.days=d;} else if(ds.f==="t") r.t=t.value.trim()||r.t; else r.color=t.value; save(); renderAll(true); return;}
  if(t.id&&t.id.startsWith("czCustom-")){document.querySelectorAll(`input[name="czColor-${t.id.slice(9)}"]`).forEach(r=>r.checked=false); t.style.setProperty("--c",t.value); return;}
});
document.addEventListener("keydown",e=>{ const ds=e.target.dataset||{}; if(e.key!=="Enter") return;
  if(ds.shopin){e.preventDefault(); shopAction("add",{dataset:{k:ds.shopin}});}
  if(e.target.id&&e.target.id.startsWith("czItem-")){e.preventDefault(); casaAction("additem",{dataset:{k:e.target.id.slice(7)}});}
  if(e.target.id&&e.target.id.startsWith("czName-")){e.preventDefault(); casaAction("addcat",{dataset:{k:e.target.id.slice(7)}});}
  if(e.target.id==="pcNewD"){e.preventDefault(); pcAction("add");}
  if(e.target.id==="evT"){e.preventDefault(); document.querySelector('[data-ev="add"]').click();}
  if(ds.aktt){e.preventDefault(); e.target.blur();} });
document.addEventListener("input",e=>{ const k=e.target.dataset&&e.target.dataset.aktt; if(!k) return; const [h,id]=k.split("|"), t=casa(h).tasks.find(x=>x.id===id); if(t){t.t=e.target.textContent; save();} });
document.addEventListener("focusout",e=>{ const k=e.target.dataset&&e.target.dataset.aktt; if(!k) return; const [h,id]=k.split("|"), C=casa(h), t=C.tasks.find(x=>x.id===id); if(t&&!t.t.trim()){C.tasks=C.tasks.filter(x=>x!==t); save(); setTimeout(()=>renderAll(true),0);} });
document.addEventListener("dragstart",e=>{ const d=e.target.closest&&e.target.closest("[data-adrag]"); if(!d) return; akDrag=d.dataset.adrag; d.classList.add("dragging"); try{e.dataTransfer.setData("text/plain",akDrag);e.dataTransfer.effectAllowed="move";}catch(err){} });
document.addEventListener("dragover",e=>{ const c=e.target.closest&&e.target.closest("[data-adrop]"); if(!c||!akDrag) return; e.preventDefault(); document.querySelectorAll(".acol.over").forEach(x=>x!==c&&x.classList.remove("over")); c.classList.add("over"); });
document.addEventListener("drop",e=>{ const c=e.target.closest&&e.target.closest("[data-adrop]"); if(!c||!akDrag) return; e.preventDefault(); const [h,id]=akDrag.split("|"), [h2,ar]=c.dataset.adrop.split("|"); akDrag=null; if(h!==h2) return; const t=casa(h).tasks.find(x=>x.id===id); if(t){t.area=ar; save();} renderAll(true); });
document.addEventListener("dragend",()=>{ akDrag=null; document.querySelectorAll(".acol.over").forEach(x=>x.classList.remove("over")); });
document.addEventListener("keydown",e=>{ if(e.key==="Enter"&&e.target.id==="shopIn"){e.preventDefault();fwAction("shopadd");} if(e.key==="Enter"&&!e.shiftKey&&e.target.id==="remIn"){e.preventDefault();fwAction("remadd");} });
document.addEventListener("keydown",e=>{ if(e.key==="Enter"&&(e.target.id==="fAmt"||e.target.id==="fNote")){e.preventDefault();finAction("add");} if(e.key==="Enter"&&e.target.id==="qcName"){e.preventDefault();finAction("quickadd");} if(e.key==="Enter"&&e.target.id==="ncName"){e.preventDefault();finAction("catadd");} });
$("#catDlg").addEventListener("close",()=>{catOpen=false;});
document.addEventListener("change",e=>{ if(e.target.id==="startD"){state.start=e.target.value; state.startSet=1; const td=todayDay(); if(td) state.day=td; save(); renderAll();} });

/* ---------- theme ---------- */
function applyTheme(){ if(state.theme) document.documentElement.setAttribute("data-theme",state.theme); else document.documentElement.removeAttribute("data-theme"); }
$("#themeBtn").addEventListener("click",()=>{const dark=state.theme?state.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches; state.theme=dark?"light":"dark"; applyTheme(); save();});

/* ---------- timer ---------- */
let T=null;
function startPreset(k,dOver){
  const d=dOver||state.day, st=stageOf(d), m=x=>x*60;
  let name, segs;
  if(k==="mind"){name="Mindset";segs=[["Llegar y poner la pieza",60],["Responder",300],["Elegir una acción",120]];}
  else if(k==="emo"){name="Gestión emocional";segs=[["Práctica del día",300]];}
  else if(k==="eng"){const em=engMin(d),sp=engSplit(em);name="Inglés, "+em+" min";segs=[["Repaso",m(sp[0])],["Conversación",m(sp[1])],["Corrección y dos frases",m(sp[2])]];}
  else if(k==="work"){name="Trabajo protegido";segs=WORKSEG.map(([n,x])=>[n,m(x)]);}
  else if(k==="cardio"){const c=CARDIO[st];name="Caminata/trote, etapa "+st;segs=[["Caminar suave",300]];for(let i=1;i<=c.r;i++){segs.push(["Trote "+i+"/"+c.r,c.onS]);segs.push(["Caminar "+i+"/"+c.r,c.offS]);}segs.push(["Caminata muy suave",300]);}
  else if(k==="weights"){const ex=exercise(d);name="Pesas "+(ex.L||"")+" + baile";segs=[["Calentamiento",360],["Pesas: a tu ritmo (descansa 60–90 s)",m(st===1?12:20)],["Transición e hidratación",120]];blocksDance(d).forEach(x=>segs.push(x));segs.push(["Marcha suave",240]);}
  else if(k==="dance"){name="Bailoterapia";segs=blocksDance(d);}
  else if(k==="y1"){name="Yoga Y1";segs=[["Respiración sentada",120],["Gato-vaca pequeño",120],["Postura del niño o descanso sentada",120],["Pantorrilla lado 1",60],["Pantorrilla lado 2",60],["Observación del cuerpo",120]];}
  else if(k==="p1"){name="Pilates P1";segs=[["Respiración y costillas",120],["Basculación pélvica",120],["Deslizar talones",120],["Apertura rodilla lado 1",60],["Apertura rodilla lado 2",60],["Descanso",120]];}
  else if(k==="y2"){name="Yoga Y2";segs=[["Postura erguida",60],["Movilidad de hombros",60],["Inclinación lado 1",60],["Inclinación lado 2",60],["Rodilla al pecho 1",60],["Rodilla al pecho 2",60],["Pantorrilla 1",60],["Pantorrilla 2",60],["Descanso",120]];}
  T={name,segs,i:0,left:segs[0][1],run:true,last:Date.now()}; drawTimer(); $("#timer").classList.add("on");
}
function blocksDance(d){const st=stageOf(d),w=wdOf(d);
  const names=w===3?["Paso lateral","Paso básico corto","Brazos con paso lateral","Marcha"]:w===5?["Marcha con música latina","Merengue suave","Salsa corta","Marcha"]:["Marcha al ritmo","Pasos laterales","Adelante/atrás","Marcha"];
  const dur=st===1?[2,2,2,2]:st===4?[3,3,3,3]:[2,3,3,2]; return names.map((n,i)=>["Baile: "+n,dur[i]*60]);}
function beep(){try{const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.frequency.value=740;g.gain.value=.08;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.25);}catch(e){} if(navigator.vibrate) navigator.vibrate(200);}
function drawTimer(){ if(!T) return; const s=T.segs[T.i], mm=Math.floor(T.left/60), ss=Math.floor(T.left%60);
  $("#tmName").textContent=T.name+" · "+(T.i+1)+"/"+T.segs.length; $("#tmSeg").textContent=s[0];
  $("#tmClock").textContent=String(mm).padStart(2,"0")+":"+String(ss).padStart(2,"0");
  $("#tmBar").style.width=(100-T.left/s[1]*100)+"%"; $("#tmPause").textContent=T.run?"Pausar":"Seguir";}
function nextSeg(){ T.i++; if(T.i>=T.segs.length){ beep(); $("#tmSeg").textContent="¡Listo!"; $("#tmClock").textContent="00:00"; T.run=false; T.done=true; return;} T.left=T.segs[T.i][1]; beep(); }
setInterval(()=>{ if(!T||!T.run) return; const now=Date.now(); T.left-=(now-T.last)/1000; T.last=now; if(T.left<=0) nextSeg(); if(!T.done) drawTimer(); },250);
$("#tmPause").onclick=()=>{ if(!T||T.done) return; T.run=!T.run; T.last=Date.now(); drawTimer(); };
$("#tmSkip").onclick=()=>{ if(!T||T.done) return; nextSeg(); T.last=Date.now(); if(!T.done) drawTimer(); };
$("#tmStop").onclick=()=>{ T=null; $("#timer").classList.remove("on"); };

applyTheme();
{const td=todayDay(); if(td) state.day=td;}
renderAll();
</script>
