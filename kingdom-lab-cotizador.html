<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Kingdom Lab · Cotizador</title>
<meta name="description" content="Arma tu plan de fotografía, audiovisual y diseño visual con Kingdom Lab, pieza por pieza."/>
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          navy: "#0B1130",
          "navy-light": "#1B2350",
          "navy-soft": "#2A3268",
          gold: "#C9A227",
          "gold-light": "#E7CC6B",
          ink: "#171A2B",
          "ink-soft": "#5B5F73",
          canvas: "#F5F5F8",
          line: "#E4E4EC"
        },
        fontFamily: { display: ["Poppins", "sans-serif"] }
      }
    }
  };
</script>
<style>
  body { font-family: "Poppins", sans-serif; }
  .material-symbols-outlined { font-variation-settings: "FILL" 0, "wght" 500, "GRAD" 0, "opsz" 24; font-size: 20px; line-height: 1; vertical-align: middle; }
  .stepper-btn:active { transform: scale(0.94); }
  ::-webkit-scrollbar { height: 6px; width: 6px; }
  ::-webkit-scrollbar-thumb { background: #d6d6e0; border-radius: 999px; }
  @media print {
    .no-print { display: none !important; }
    body { background: #fff; }
  }
</style>
</head>
<body class="bg-canvas text-ink min-h-screen">

<header class="no-print bg-navy text-white sticky top-0 z-30">
  <div class="max-w-6xl mx-auto px-4 md:px-8 h-16 flex items-center justify-between gap-4">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-gold-light to-gold flex items-center justify-center font-display font-extrabold text-navy">K</div>
      <div class="leading-tight">
        <p class="font-display font-bold text-sm md:text-base">Kingdom Lab</p>
        <p class="text-[11px] text-white/60 -mt-0.5 hidden sm:block">Fotografía · Audiovisual · Diseño visual</p>
      </div>
    </div>
    <div class="flex items-center gap-2 md:gap-3">
      <a href="kingdom-lab-anexo.html" class="text-xs md:text-sm text-white/80 hover:text-white transition-colors px-2 py-1.5 rounded-md hover:bg-white/10">
        Servicios adicionales
      </a>
      <button id="btn-reset" type="button" class="flex items-center gap-1.5 text-xs md:text-sm text-white/80 hover:text-white transition-colors px-2.5 py-1.5 rounded-md hover:bg-white/10">
        <span class="material-symbols-outlined !text-[16px]">restart_alt</span>
        <span class="hidden sm:inline">Reiniciar</span>
      </button>
    </div>
  </div>
</header>

<main class="max-w-6xl mx-auto px-4 md:px-8 py-8 md:py-10 pb-28">

  <div class="mb-8 md:mb-10">
    <h1 class="font-display font-extrabold text-3xl md:text-[40px] leading-[1.1] tracking-tight text-navy">Tu plan, pieza por pieza.</h1>
    <p class="text-ink-soft text-sm md:text-base mt-2 max-w-xl">Las recomendaciones son un punto de partida: puedes adaptar cada cantidad a tu presupuesto.</p>
  </div>

  <nav id="step-nav" class="no-print flex items-center gap-2 md:gap-3 mb-6 overflow-x-auto pb-1"></nav>

  <div id="step-root" class="bg-white border border-line rounded-2xl shadow-[0_20px_40px_rgba(11,17,48,0.06)] min-h-[420px]"></div>

</main>

<div id="footer-bar" class="no-print fixed bottom-0 inset-x-0 bg-white/95 backdrop-blur border-t border-line z-30">
  <div class="max-w-6xl mx-auto px-4 md:px-8 h-20 flex items-center justify-between gap-4">
    <div id="footer-total" class="text-sm text-ink-soft"></div>
    <div class="flex items-center gap-3">
      <button id="btn-back" type="button" class="px-5 py-2.5 rounded-lg border border-line text-sm font-semibold text-ink hover:bg-canvas transition-colors">Atrás</button>
      <button id="btn-next" type="button" class="px-6 py-2.5 rounded-lg bg-navy text-white text-sm font-semibold hover:bg-navy-light transition-colors flex items-center gap-2">
        <span id="btn-next-label">Continuar</span>
        <span class="material-symbols-outlined !text-[18px]">arrow_forward</span>
      </button>
    </div>
  </div>
</div>

<script src="kingdom-lab.js?v=1"></script>
</body>
</html>
